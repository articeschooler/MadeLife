 if(mine.length&&!g.prison)for(const r of shuffle(liveR(g))){if(!r.war&&r.str>0&&chance(r.host/280*M*(1+n*.12)*vioF(g))){y.attack=r.id;y.attackD=pick(mine).id;break;}}
 if(!g.prison)for(const c of active(g)){if(chance(g.s.heat/1000*M)){y.pinched=c.id;break;}}
 if(fam(g)&&g.rank<4&&g.tribute!=='honest'&&!g.prison){y.skim=chance(((g.tribute==='light'?.14:.32)-g.s.discretion/600+(g.favor<40?.05:0))*M);}
 if(fam(g)&&trad(g)&&g.rank<4&&!g.f.drugsOk&&mine.some(d=>d.rk.includes('drugs'))&&!g.prison)y.drugs=chance(.35*M);
 const hot=liveR(g).filter(r=>r.host>=88).sort((a,b)=>b.str-a.str)[0];
 if(!g.prison){if(fam(g)&&g.rank<4&&(g.favor<15||(g.f.marked||0)>=2)&&chance(.55*M)){y.danger=1;y.dangerFam=1;}else if(hot&&chance(.45*M)){y.danger=1;y.dangerR=hot;}}
 if(fam(g)&&g.npc.boss&&!g.prison){const b=g.npc.boss;if(chance(Math.max(0,(b.age-69)*.035)*M))y.bossGone='dead';else if(chance((.03+g.inv/2000)*M))y.bossGone='arrest';}
 if(!g.prison&&(n||g.famName))for(const r of liveR(g)){if(!r.war&&r.host>=75&&chance((r.host-70)/100*(1+n*.12)/20*vioF(g))){y.warDecl=r.id;break;}}
 for(const r of liveR(g))if(r.war&&(r.str<12||r.str<crewStr(g)/3)&&chance(.06)){y.peace=r.id;break;}
 if(g.f.spawn&&T(g)>=g.f.spawn){g.f.spawn=0;const r=spawnFamily(g);if(r)y.newFam=r.id;}
}
function endWeek(){if(!G||G.ending)return;if(CUR){return;}const g=G;if(g.week===0||!g.yt)g.yt={inc:0,out:0,h0:g.s.heat,i0:g.inv,notes:[]};const idle=g.ap>=apMax(g)&&!g.prison;preWeek();if(idle){g.s.heat=clamp(g.s.heat-10);g.inv=clamp(g.inv-5);g.y.idle=1;}const t=T(g);
 const forced=[],pool=[];
 for(const e of EV){if(e.once&&g.seen[e.id])continue;if(!e.once&&g.seen[e.id]!=null&&t-g.seen[e.id]<(e.cd||4)*52)continue;if(!e.any&&!!e.prison!==g.prison>0)continue;let c=false;try{c=e.cond(g)}catch(x){c=false}if(!c)continue;(e.force?forced:pool).push(e);}
 forced.sort((a,b)=>b.force-a.force);const q=forced.slice(0,2);
 if(q.length<2&&pool.length&&chance(g.prison?.05:.09))q.push(pick(pool));
 Q=q.map(e=>({...e,title:typeof e.title==='function'?e.title(g):e.title}));onQ=economy;
 if(Q.length)openEvent(Q.shift());else economy();}
function economy(){const g=G;if(g.ending)return showEnding();const t=T(g),M=1/52;const notes=[];const L=ledger(g,true);const mine=myD(g);
 const inc=(L.rk+L.crew+L.street+L.cut+L.ven+L.emp)*M, out=(L.trib+L.pay+L.bribes+L.up)*M;
 g.dirty+=inc-(L.trib+L.pay+L.bribes)*M;if(inc>0)g.earned+=inc;
 spendClean(L.up*M);
 let unpaid=false;if(cash(g)<0){unpaid=active(g).length>0;g.dirty=0;g.clean=0;if(unpaid)notes.push('<span class="neg">You couldn\'t make payroll this week. Your crew noticed.</span>');}
 if(g.dirty<0){g.clean+=g.dirty;g.dirty=0;}if(g.clean<0){g.dirty+=g.clean;g.clean=0;}
 const lc=Math.min(g.dirty,L.laund*M);if(lc>0){g.dirty-=lc;g.clean+=lc;}
 const decay=5+g.s.discretion/10+L.fix*1.2+(g.npc.detective.pad?6:0)+g.pol/20+(g.ops.scanner?3:0)+(g.ops.carswap?2:0)+(g.ops.lobbyist?5:0)+(g.emp.includes('media')?6:0)+(g.emp.includes('governor')?8:0)+(g.emp.includes('network')?12:0);
 g.s.heat=clamp(g.s.heat+(L.heatGen*.55+L.flash-decay)*M);if(g.prison)g.s.heat=Math.min(g.s.heat,15);
 const rats=active(g).filter(c=>c.rat).length+g.crew.filter(c=>c.st==='p'&&c.rat).length;
 let di=Math.max(0,g.s.heat-35)/2.5+Math.max(0,g.s.heat-65)*10+rats*(g.emp&&g.emp.includes('intel')?3.5:7)+(g.dirty>500000&&L.laund<50000?3:0)-(g.s.heat<20?5:0)-g.pol/30-(g.npc.judge.owned?2:0);if(!trad(g))di*=1.15;if(di>0&&g.ops.burners)di*=.85;if(di>0&&g.ops.lobbyist)di*=.9;if(di>0&&g.ops.couriers)di*=.8;if(di>0&&g.ops.mole)di*=.75;if(g.ops.exfbi)di-=4;if(di>0&&g.emp.includes('senator'))di*=.5;if(di>0&&g.emp.includes('governor'))di*=.6;if(g.emp.includes('intel'))di-=5;if(g.prison)di=-10;
 g.inv=clamp(g.inv+di*M);g.f.vio=(g.f.vio||0)*.99;
 if(g.ops.doctor&&g.s.health<80)g.s.health=clamp(g.s.health+.15);
 for(const c of g.crew){if(c.st==='p'&&c.out&&c.out<=t){c.st='a';c.out=0;notes.push(`${crewName(c)} came home from prison.`);}}
 for(const c of active(g)){let d=(2+(g.s.respect-40)/12+(g.s.fear-40)/20+(g.s.charisma-40)/18-c.gr/18)*M+(Math.random()-.5)*.6;if(unpaid)d-=3;if(g.prison)d-=8*M;c.loy=clamp(c.loy+d);
  if(!c.rat&&c.loy<35&&g.inv>25&&chance((.2+(g.inv-25)/200)*M))c.rat=true;
  if(c.loy<10&&!c.rat&&chance(.45*M)){c.st='g';notes.push(`${crewName(c)} walked away from your crew.`);log(`${crewName(c)} quit the crew.`);}}
 // rivals: they grow, they resent the biggest player, and at war they hit you
 for(const [ck,dist,rivals,ext] of cityList(g))cityTick(g,ck,dist,rivals,notes,M,ext);
 if(g.prison)for(const d of myD(g)){if(crewStr(g)<40&&chance(.2*M)){const r=liveR(g).slice().sort((a,b)=>b.str-a.str)[0];if(!r)break;d.own=r.id;d.rk=[];notes.push(`<span class="neg">With you inside, ${r.n} took ${d.n}.</span>`);log(`Lost ${d.n} while in prison.`);}}
 // people
 if(g.spouse&&g.spouse.married)g.spouse.rel=clamp(g.spouse.rel+(-3+g.life.house*1.5-(g.mistress?4:0)-(g.prison?10:0))*M);
 if(g.preg&&t>=g.preg.due){const p=g.preg;g.preg=null;const sex=chance(.5)?'m':'f';const k={first:sex==='m'?pick(HER[g.her].f):pick(FEM),sex,age:0,rel:80,path:null,mom:p.mom};g.kids.push(k);notes.push(`<span class="pos">${p.mom} gave birth to ${sex==='m'?'a son':'a daughter'}: ${k.first}.</span>`);log(`${sex==='m'?'Son':'Daughter'} ${k.first} born to ${p.mom}.`);if(p.src==='mistress'&&g.spouse&&chance(.5)){g.spouse.rel=clamp(g.spouse.rel-35);notes.push(`<span class="neg">Your wife found out about the baby.</span>`);}}
 if(g.mistress)g.mistress.rel=clamp(g.mistress.rel-6*M);
 if(fam(g)&&g.rank<4){const base=g.tribute==='honest'?1:-1;g.favor=clamp(g.favor+(base+(L.trib>100000?2:0))*M);}
 g.yt.inc+=inc;g.yt.out+=out;g.yt.notes.push(...notes.map(n=>'Wk '+(g.week+1)+' — '+n));
 g.lastWeek={inc,out,net:inc-out};
 if(g.week===51){const y=g.yt;const html=`<div class="card dark ledger" style="margin-top:4px"><div><span>Brought in</span><span class="pos">+${money(y.inc)}</span></div><div><span>Paid out (kick-up, payroll, bribes, living)</span><span class="neg">−${money(y.out)}</span></div><div class="tot"><span>Net for ${g.year}</span><span class="${y.inc-y.out<0?'neg':'pos'}">${money(y.inc-y.out)}</span></div></div>
 <div class="ledger" style="margin-top:10px"><div><span>Heat</span><span>${Math.round(y.h0)} → ${Math.round(g.s.heat)}</span></div><div><span>Federal case</span><span>${Math.round(y.i0)} → ${Math.round(g.inv)}</span></div><div><span>Territory</span><span>${myD(g).length} of ${g.dist.length}</span></div><div><span>Cash on hand</span><span>${money(cash(g))}</span></div></div>
 ${y.notes.length?`<div style="margin-top:12px;font-size:13px">${y.notes.slice(-10).map(n=>`<p style="margin:5px 0">· ${n}</p>`).join('')}</div>`:''}`;
  Q=[];onQ=finishWeek;info('The Year in Review',html,`December ${g.year}`);$('#mbox .choice b').textContent=`Begin ${g.year+1}`;return;}
 if(notes.length){Q=[];onQ=finishWeek;info(`End of Week ${g.week+1}`,`<div class="ledger"><div><span>Net this week</span><span class="${inc-out<0?'neg':'pos'}">${money(inc-out)}</span></div>${g.y.idle?'<div><span>A quiet week</span><span class="pos">Heat −10 · Case −5</span></div>':''}</div><div style="margin-top:10px;font-size:14px">${notes.map(n=>`<p style="margin:5px 0">· ${n}</p>`).join('')}</div>`,dateStr(g));$('#mbox .choice b').textContent=`On to week ${(g.week+1)%52+1}`;return;}
 toast(`Week ${g.week+1}: ${inc-out<0?'':'+'}${money(inc-out)}${g.y.idle?' · Quiet week: heat −10, case −5':''}`,true);finishWeek();}
function newYear(){const g=G;g.age++;
 for(const k of g.kids){k.age++;k.rel=clamp(k.rel-2-(g.prison?6:0));}
 if(g.npc.mother.alive)g.npc.mother.age++;if(g.npc.boss)g.npc.boss.age++;
 for(const c of active(g)){c.yrs++;if(chance(.15)&&c.sk<10)c.sk++;}
 let hd=g.age>38?R(0,2):0;if(g.age>50)hd+=R(1,3);if(g.age>62)hd+=R(1,3);if(g.prison)hd+=1;if(g.f.slow)hd-=1;g.s.health=clamp(g.s.health-hd+(g.age<35?1:0));
 if(g.f.marked&&chance(.3))g.f.marked--;
 if(g.age===18)log('Eighteen. Old enough to do real time.');}
function finishWeek(){const g=G;if(g.ending)return showEnding();
 if(g.prison){g.prison--;g.prisonYears+=1/52;if(!g.prison){A({respect:5});log('Released from prison.');toast('Released from prison.');}}
 if(isTop(g))g.bossYears+=1/52;g.peak=Math.max(g.peak,rankNum(g));
 g.week++;if(g.week>=52){g.week=0;g.year++;newYear();
  if(g.age>=70&&chance((g.age-70)*.025+(100-g.s.health)/400)){end(g.prison?'diedInside':'oldage');return showEnding();}
  if(g.age>=85){end('oldage');return showEnding();}}
 if(g.f.contract&&(T(g)>=g.f.contract.due||g.prison||!fam(g))){const nm=g.f.contract.name;g.f.contract=null;if(fam(g)){g.favor=clamp(g.favor-25);g.s.respect=clamp(g.s.respect-8);log(`Failed to carry out the contract on ${nm}.`);toast(`You missed the contract on ${nm}. The family won't forget it.`);}}
 g.ap=apMax(g);
 if(g.s.health<=0){end(g.prison?'diedInside':'heart');return showEnding();}
 if(!fam(g)&&allD(g).length===0&&active(g).length===0&&cash(g)<5000&&g.s.respect<35&&g.age>23){g.f.broke=(g.f.broke||0)+1;if(g.f.broke>=26){end('exiled');return showEnding();}if(g.f.broke===1)toast('No crew, no turf, no money. Rebuild fast — or leave town.');}else g.f.broke=0;
 save();render();}

/* ================= SAVE ================= */
function save(){try{localStorage.setItem('made_save',JSON.stringify(G))}catch(e){}}
function loadSave(){try{const s=localStorage.getItem('made_save');if(!s)return null;const g=JSON.parse(s);return g&&g.v===4?g:null;}catch(e){return null}}

 v.innerHTML=({life:vLife,crew:vCrew,turf:vTurf,people:vPeople,law:vLaw,shop:vShop}[TAB]||vLife)(G);}

 <div class="hrow"><span class="chip"><b>Clean</b><span style="color:var(--gn)">${money(g.clean)}</span></span><span class="chip"><b>Dirty</b><span style="color:#e08a82">${money(g.dirty)}</span></span><span class="chip"><b>Heat</b><span style="color:${g.s.heat>60?'#e08a82':g.s.heat>35?'#d7b57a':'inherit'}">${Math.round(g.s.heat)}</span></span><span class="chip"><b>Case</b><span style="color:${g.inv>70?'#e08a82':'inherit'}">${Math.round(g.inv)}</span></span><span class="chip"><b>Time</b><span class="ap">${ap}</span></span><button class="chip" data-a="save" style="color:var(--gd);cursor:pointer">Save</button></div>`;

 <div class="sec">Buy your way out of the heat</div><div style="display:grid;gap:6px">${HEATOPS.map(h=>{const wt=heatWait(g,h),nd=h.need&&!h.need(g);return`<button class="act" data-a="heat" data-x="${h.k}" ${g.prison||wt||nd||cash(g)<h.c||(h.ap&&g.ap<1)?'disabled':''}><b>${h.n} <span class="mono" style="display:inline;float:right;color:var(--gd)">${h.c?money(h.c):'Free'}</span></b><span>${h.d} · Heat ${h.heat}${h.inv?` · Case ${h.inv}`:''}${h.p?` · ≈${Math.round(h.p(g)*100)}%`:''}${wt?` · ready in ${wt} wk`:nd?' · '+h.needT:''}</span></button>`}).join('')}</div>
 <div class="card" style="margin-top:10px"><div class="ledger"><div><span>Fronts clean per year</span><span>${money(L.laund)}</span></div><div><span>Clean cash</span><span>${money(g.clean)}</span></div><div><span>Dirty cash</span><span>${money(g.dirty)}</span></div><div><span>Political pull</span><span>${Math.round(g.pol)}</span></div><div><span>Judge</span><span>${g.npc.judge.owned?'Friendly':'—'}</span></div></div><div class="muted small" style="margin-top:8px">Buying luxuries with dirty money draws heat. A pile of unexplained cash with no fronts slowly feeds the federal case.</div></div>
 ${g.f.card?`<div class="card muted small">Agent ${full(g.npc.fed)}'s card is still in your wallet.</div>`:''}`;}
function vShop(g){const c=cash(g);
 const life=Object.entries(LS).map(([k,l])=>`<div class="card"><div class="row"><b class="sp">${l.n}</b><span class="muted small">${l.t[g.life[k]||0][0]}</span></div><div style="display:grid;gap:6px;margin-top:8px">${l.t.map((t,i)=>i===0?'':`<button class="act" data-a="buy" data-x="${k}:${i}" ${i<=(g.life[k]||0)||c<t[1]?'disabled':''}><b>${t[0]} <span class="mono" style="display:inline;float:right;color:var(--gd)">${i<=(g.life[k]||0)?'Owned':money(t[1])}</span></b><span>Respect +${Math.max(0,(i-(g.life[k]||0))*3)} · flash heat · upkeep${i>(g.life[k]||0)&&g.clean<t[1]&&c>=t[1]?` · <span style="color:#e08a82">uses ${money(t[1]-g.clean)} dirty: case +${dirtyInv(t[1]-g.clean)}</span>`:''}</span></button>`).join('')}</div></div>`).join('');
 const ops=Object.entries(OPS).map(([k,o])=>`<button class="act" data-a="op" data-x="${k}" ${g.ops[k]||c<o.c?'disabled':''}><b>${o.n} <span class="mono" style="display:inline;float:right;color:var(--gd)">${g.ops[k]?'Owned':money(o.c)}</span></b><span>${o.d}${o.u?` · ${money(o.u)}/yr`:''}${!g.ops[k]&&g.clean<o.c&&c>=o.c?` · <span style="color:#e08a82">uses ${money(o.c-g.clean)} dirty: case +${dirtyInv(o.c-g.clean)}</span>`:''}</span></button>`).join('');
 const nw=netWorth(g),unl=nw>=2e6;
 const emp=Object.entries(EMP).filter(([k,e])=>!e.late).sort((a,b)=>a[1].c-b[1].c).map(([k,e])=>{const own=g.emp.includes(k);return`<button class="act" data-a="emp" data-x="${k}" ${own||!unl||c<e.c?'disabled':''}><b>${e.n} <span class="mono" style="display:inline;float:right;color:var(--gd)">${own?'Owned':money(e.c)}</span></b><span>${e.d}${e.i?` · +${money(e.i)}/yr`:''}${e.l?` · cleans ${money(e.l)}/yr`:''}${e.u?` · ${money(e.u)}/yr upkeep`:''}${e.resp?` · respect +${e.resp}`:''}${e.pol?` · pull +${e.pol}`:''}${!own&&g.clean<e.c&&c>=e.c?` · <span style="color:#e08a82">uses ${money(e.c-g.clean)} dirty: case +${dirtyInv(e.c-g.clean)}</span>`:''}</span></button>`;}).join('');
 return`<div class="card" style="margin-top:6px"><div class="row"><div class="sp"><div class="muted small">Clean money</div><div class="mono" style="font-size:18px;color:var(--gn)">${money(g.clean)}</div></div><div class="sp"><div class="muted small">Dirty money</div><div class="mono" style="font-size:18px;color:#e08a82">${money(g.dirty)}</div></div><button class="btn sm" data-a="launder" ${g.dirty<1000?'disabled':''}>Launder</button></div><div class="muted small" style="margin-top:8px">Shop purchases use clean money first. <b style="color:#e08a82">Any dirty money you spend on lifestyle, operations, empire or legacy pushes the federal case up hard</b> — about +1 for every $25K, up to +40 per purchase. Guns are bought on the street with cash, no paper trail.</div></div>
 <div class="sec">Your arsenal</div><div class="muted small" style="margin-bottom:8px">Personal pieces. Each one makes you more dangerous — and more feared. Carrying adds a little heat.</div><div style="display:grid;gap:6px">${Object.entries(GUNS).map(([k,w])=>{const own=(g.guns||[]).includes(k);return`<button class="act" data-a="gun" data-x="${k}" ${own||c<w.c?'disabled':''}><b>${w.n} <span class="mono" style="display:inline;float:right;color:var(--gd)">${own?'Owned':money(w.c)}</span></b><span>${w.d} · Violence +${w.v} · Fear +${w.f}${w.r?` · Respect +${w.r}`:''} · Crew strength +${w.cs}</span></button>`}).join('')}</div>
 <div class="sec">Operations</div><div class="muted small" style="margin-bottom:8px">Tools of the trade. One-time purchases that change how the life works for you.</div><div style="display:grid;gap:6px">${ops}</div>
 <div class="sec">Empire</div><div class="muted small" style="margin-bottom:8px">${unl?'For a man with real money. Income, laundering, influence — and a legacy.':`Opens at a net worth of $2M (you're at ${money(nw)}).`}</div><div style="display:grid;gap:6px">${emp}</div>
 ${highRank(g)?`<div class="sec" style="color:#e0b96a">Legacy</div><div class="muted small" style="margin-bottom:8px">For the men at the very top. Fortunes, governments, and a name that outlives you.</div><div style="display:grid;gap:6px">${Object.entries(EMP).filter(([k,e])=>e.late).sort((a,b)=>a[1].c-b[1].c).map(([k,e])=>{const own=g.emp.includes(k);return`<button class="act" style="border-color:var(--gd2)" data-a="emp" data-x="${k}" ${own||c<e.c?'disabled':''}><b>${e.n} <span class="mono" style="display:inline;float:right;color:var(--gd)">${own?'Owned':money(e.c)}</span></b><span>${e.d}${e.i?` · +${money(e.i)}/yr`:''}${e.l?` · cleans ${money(e.l)}/yr`:''}${e.u?` · ${money(e.u)}/yr upkeep`:''}${e.resp?` · respect +${e.resp}`:''}${e.pol?` · pull +${e.pol}`:''}${!own&&g.clean<e.c&&c>=e.c?` · <span style="color:#e08a82">uses ${money(e.c-g.clean)} dirty: case +${dirtyInv(e.c-g.clean)}</span>`:''}</span></button>`;}).join('')}</div>`:''}
 <div class="sec">How you live</div><div class="muted small" style="margin-bottom:10px">Status earns respect on the street and draws attention everywhere else. Purchases use clean money first; dirty money spent this way adds heat.</div>${life}
 <div class="sec">Giving back</div><div class="grid2"><button class="act" data-a="charity" ${g.prison?'disabled':''}><b>Donate to the parish</b><span>$25K · respect, a little heat off</span></button><button class="act" data-a="vac" ${g.ap<1||g.prison?'disabled':''}><b>Take a real vacation</b><span>1 action · $20K · once a year · heat −5</span></button></div>`;}

/* ================= TITLE / SETUP ================= */
function skyline(){let s='';let x=0;while(x<800){const w=R(28,70),h=R(60,240);s+=`<rect x="${x}" y="${260-h}" width="${w}" height="${h}" fill="#101216"/>`;for(let wy=260-h+10;wy<250;wy+=14)for(let wx=x+6;wx<x+w-6;wx+=10)if(chance(.12))s+=`<rect x="${wx}" y="${wy}" width="4" height="6" fill="${chance(.8)?'#c9a35b':'#e9e4d8'}" opacity="${(Math.random()*.6+.2).toFixed(2)}"/>`;x+=w+R(0,6);}return`<svg class="sky" viewBox="0 0 800 260" preserveAspectRatio="xMidYMax slice">${s}</svg>`;}
function renderTitle(){$('#hdr').classList.add('hidden');$('#dock').classList.add('hidden');const sv=loadSave();
 $('#view').innerHTML=`<div class="title">${skyline()}<div style="position:relative"><div class="logo">MADE<em>A life in the life</em></div><p class="tagline">Start as a nobody — at sixteen or twenty-one. Earn, scheme, and survive your way up — or out — over forty years in an American city run by men who never write anything down.</p>
 ${sv?`<button class="btn gold" style="width:100%;padding:14px;margin-bottom:8px" data-a="cont">Continue — ${esc(sv.first+' '+sv.last)}, age ${sv.age}</button>`:''}
 <button class="btn ${sv?'':'gold'}" style="width:100%;padding:14px" data-a="setup">Begin a new life</button><button class="btn sm" style="width:100%;margin-top:8px" data-a="import">Load from a save code</button></div></div>`;}
function renderSetup(){const s=SETUP;const H=HER[s.her];
 const opt=(key,obj)=>`<div class="opt">${Object.entries(obj).map(([k,v])=>`<button data-a="pick" data-x="${key}:${k}" class="${s[key]===k?'on':''}"><b>${v.n}</b><span>${v.d}</span></button>`).join('')}</div>`;
 $('#view').innerHTML=`<div style="padding:30px 2px 40px"><div class="ekick">New life</div><div class="etitle" style="font-size:30px">Who are you?</div>
 <div class="sec">Name</div><div class="grid2"><input type="text" id="fn" value="${esc(s.first)}" placeholder="First"><input type="text" id="ln" value="${esc(s.last)}" placeholder="Last"></div>
 <div class="row" style="margin-top:8px"><input type="text" id="nk" value="${esc(s.nick)}" placeholder="Nickname (optional)"><button class="btn" data-a="rname">Random</button></div>
 <div class="sec">City</div>${opt('city',CITIES)}
 <div class="sec">Heritage</div>${opt('her',HER)}
 <div class="sec">Background</div>${opt('bg',BGS)}
 <div class="sec">The organization</div>${opt('model',{trad:{n:'Traditional Cosa Nostra',d:'Made men, omertà, no drugs (officially). Italian blood only. Unions & construction pay more.'},modern:{n:'Modern Syndicate',d:'Open membership, flexible rules, drugs and cyber-fraud pay more. Federal tech catches more.'}})}
 <div class="sec">Starting position</div>${opt('start',{young:{n:'Street Kid at 16',d:'No crew, no money, no name. Hustle, find associates, and found a family of your own.'},family:{n:'Family Associate at 21',d:'Under a sponsor. Climb the ladder: soldier, capo, underboss, boss.'},indie:{n:'Independent Crew at 21',d:'Two guys and one neighborhood. Answer to nobody.'}})}
 ${s.start==='young'?`<div class="note">You'll start with nothing. A family may notice you and offer to take you on — or you can build your own and name it.</div>`:''}${s.model==='trad'&&s.her!=='italian'&&s.start==='family'?`<div class="note">A traditional family will let you earn with them — but will never make you. You'll be able to break away when you're ready.</div>`:''}
 <button class="btn gold" style="width:100%;padding:15px;margin-top:22px;font-size:14px" data-a="start">Step into the life</button>
 <button class="btn" style="width:100%;margin-top:8px" data-a="title">Back</button></div>`;window.scrollTo(0,0);}
function syncSetup(){const f=$('#fn'),l=$('#ln'),n=$('#nk');if(f){SETUP.first=f.value.trim();SETUP.last=l.value.trim();SETUP.nick=n.value.trim();}}
function randName(){const p=person(SETUP.her);SETUP.first=p.first;SETUP.last=p.last;SETUP.nick='';}

/* ================= INPUT ================= */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,x=b.dataset.x;
 switch(a){
 case'ch':return choose(+x);case'next':return next();
 case'tab':TAB=x;render();window.scrollTo(0,0);return;
 case'endWeek':return endWeek();
 case'act':return doAct(x);
 case'trib':G.tribute=x;render();return;
 case'seld':SEL=+x;render();return;
 case'turf':{const[m,id]=x.split(':');return turf(m,+id);}
 case'rack':{const[id,k]=x.split(':');return addRacket(+id,k);}
 case'repair':{const[id,k]=x.split(':');return repair(+id,k);}
 case'sec':return secUp(+x);
 case'riv':{const[m,id]=x.split(':');return rivalAct(m,id);}
 case'crew':return crewAct(x);
 case'ppl':{const[k,v]=x.split(':');return people(k,v);}
 case'mist':return people('mist',x);
 case'buy':{const[k,t]=x.split(':');return buyLife(k,+t);}
 case'gun':return buyGun(x);case'city':return goCity(x);case'expand':return expandMenu();case'heat':return heatOp(x);case'inv':return lawOp(x);case'save':save();toast('Saved.',true);return;case'export':return exportModal();case'import':return importModal();case'loadcode':return loadCode();case'copysave':{const t=$('#savecode');try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied.',true),()=>{t.select();toast('Select all and copy it manually.');});}catch(e){t.select();toast('Select all and copy it manually.');}return;}case'closerk':{const[id,k]=x.split(':');return closeRacket(+id,k);}case'op':return buyOp(x);case'emp':return buyEmp(x);
 case'found':return found();
 case'charity':return charity();case'vac':return vacation();case'launder':return launder();
 case'big':return bigMove(x);
 case'title':G=null;return renderTitle();
 case'cont':G=loadSave();if(!G.home)G.home=G.city;TAB='life';SEL=null;return render();
 case'setup':SETUP={first:'',last:'',nick:'',city:'newyork',her:'italian',bg:'street',model:'trad',start:'family'};randName();return renderSetup();
 case'pick':{syncSetup();const[k,v]=x.split(':');SETUP[k]=v;return renderSetup();}
 case'rname':syncSetup();randName();return renderSetup();
 case'start':{syncSetup();if(!SETUP.first||!SETUP.last)randName();newGame(SETUP);TAB='life';SEL=null;save();render();window.scrollTo(0,0);
  const st=SETUP.start;
  info(st==='young'?'Sixteen':'Twenty-One',`<p>${esc(CITIES[SETUP.city].n)}, January ${G.year}. ${st==='young'?`You're sixteen, with three hundred dollars and nobody's protection. Hustle. Find associates — kids like you who want more. Build respect and money, and one day put your own name on a family.`:st==='indie'?`You have two guys, one neighborhood, and no one to answer to. Every crew in the city is a rival — including ${esc(CITIES[SETUP.city].fam)}.`:`${esc(S(G))} has agreed to take you on. You're not made. You're not anything yet. You're a guy who gets coffee and doesn't ask questions.`}</p><p>Every week you get a couple of moves — more as you rise. Make them, then end the week: money moves, heat builds or cools, and sometimes the phone rings. End a week without doing anything and you lie low: heat −10, federal case −5. Progress is slow. That's the life.</p><p class="muted" style="font-size:13px">Watch your Heat and the federal Case. Pay your crew. The more territory you hold, the more it pays — and the more the other families want you dead.</p>`,'A new life');return;}
 }});
renderTitle();
</script>
</body>
</html>
