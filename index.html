<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Made — A Life in the Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--p:#121418;--p2:#181b20;--ln:#262a31;--tx:#e9e4d8;--mu:#8d877b;--gd:#c9a35b;--gd2:#7d6334;--rd:#b8463e;--gn:#7fa071;--bl:#6b8fb8;--serif:'Playfair Display',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--tx);font:14px/1.55 Inter,system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#rain{position:fixed;inset:-40px;pointer-events:none;opacity:.05;z-index:0;background-image:repeating-linear-gradient(100deg,transparent 0 22px,#cfd8e8 22px 23px);animation:rain .6s linear infinite}
@keyframes rain{to{transform:translate(-8px,46px)}}
@media (prefers-reduced-motion:reduce){#rain{animation:none}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% -10%,rgba(201,163,91,.10),transparent 55%),radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75))}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 0 150px}
.hidden{display:none!important}
/* header */
#hdr{position:sticky;top:0;z-index:5;background:linear-gradient(#0a0b0df2,#0a0b0de0);backdrop-filter:blur(6px);border-bottom:1px solid var(--ln);padding:12px 16px 10px}
.hname{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.2px;line-height:1.2}
.hsub{color:var(--mu);font-size:12px;letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.hrow{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12px;padding:3px 8px;border:1px solid var(--ln);border-radius:4px;background:var(--p);white-space:nowrap}
.chip b{font-weight:500;color:var(--mu);margin-right:4px;font-family:Inter;font-size:10px;letter-spacing:.8px;text-transform:uppercase}
.ap{display:inline-flex;gap:3px;vertical-align:middle}.ap i{width:8px;height:8px;border-radius:50%;border:1px solid var(--gd);display:inline-block}.ap i.on{background:var(--gd)}
/* nav */
#dock{position:fixed;bottom:0;left:0;right:0;z-index:6;background:linear-gradient(transparent,#0a0b0d 18%);padding-top:14px}
#dock .in{max-width:760px;margin:0 auto;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
#endy{width:100%;padding:13px;border-radius:6px;background:var(--gd);color:#16120a;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;font-size:13px;box-shadow:0 6px 24px rgba(201,163,91,.18)}
#endy:active{transform:translateY(1px)}
.endrow{display:flex;gap:8px}#endy{flex:1}#skip{flex:none;padding:0 14px;border:1px solid var(--gd2);border-radius:6px;color:var(--gd);font-size:12px;letter-spacing:.8px;text-transform:uppercase;background:var(--p)}
#toast.info{background:#15171b;border-color:var(--gd2);color:var(--tx)}
#tabs{display:grid;grid-template-columns:repeat(6,1fr);margin-top:8px;border:1px solid var(--ln);border-radius:6px;overflow:hidden;background:var(--p)}
#tabs button{padding:10px 2px;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--mu);border-right:1px solid var(--ln)}
#tabs button:last-child{border-right:0}
#tabs button.on{color:var(--gd);background:var(--p2);box-shadow:inset 0 -2px 0 var(--gd)}
/* view */
#view{padding:14px 14px 0}
.sec{margin:18px 0 8px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gd);display:flex;align-items:center;gap:10px}
.sec:after{content:'';flex:1;height:1px;background:var(--ln)}
.card{background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:10px}
.card.dark{background:#0e1013}
.muted{color:var(--mu)}.small{font-size:12px}.mono{font-family:var(--mono)}
.serif{font-family:var(--serif)}
.row{display:flex;gap:10px;align-items:center}.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border:1px solid var(--ln);border-radius:5px;background:var(--p2);font-size:13px;font-weight:500;transition:border-color .15s}
.btn:hover{border-color:var(--gd2)}
.btn.gold{border-color:var(--gd2);color:var(--gd)}
.btn.red{border-color:#5a2723;color:#e08a82}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:12px}
.act{text-align:left;padding:11px 12px;border:1px solid var(--ln);border-radius:7px;background:var(--p2);display:block;width:100%}
.act:hover{border-color:var(--gd2)}
.act b{display:block;font-weight:600;font-size:13.5px}
.act span{display:block;color:var(--mu);font-size:12px;margin-top:2px;line-height:1.4}
.act[disabled]{opacity:.38}
.stat{display:grid;grid-template-columns:104px 1fr 30px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.stat .l{color:var(--mu)}
.bar{height:6px;background:#22252b;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gd);border-radius:3px}
.stat .v{font-family:var(--mono);text-align:right}
.seg{display:flex;border:1px solid var(--ln);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:8px 4px;font-size:12px;border-right:1px solid var(--ln);color:var(--mu)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--p2);color:var(--gd)}
.ledger div{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dashed #22252b}
.ledger div span:last-child{font-family:var(--mono)}
.ledger .tot{border-bottom:0;border-top:1px solid var(--ln);margin-top:4px;padding-top:6px;font-weight:600}
.pos{color:var(--gn)}.neg{color:#e08a82}
.log p{font-size:13px;padding:6px 0;border-bottom:1px solid #1c1f24;color:#cfc9bc}
.log p b{font-family:var(--mono);color:var(--gd);font-weight:500;margin-right:8px;font-size:12px}
/* map */
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{position:relative;min-height:74px;padding:9px 9px 8px;border-radius:6px;background:var(--p2);border:1px solid var(--ln);text-align:left;overflow:hidden}
.tile .nm{font-size:12.5px;font-weight:600;line-height:1.2;display:block;padding-right:20px}
.tile .ow{font-size:10px;letter-spacing:.6px;text-transform:uppercase;margin-top:4px;display:block}
.tile .w{position:absolute;right:7px;top:8px;font-family:var(--mono);font-size:10px;color:var(--mu)}
.tile .dots{position:absolute;left:9px;bottom:7px;display:flex;gap:3px}.tile .dots i{width:6px;height:6px;border-radius:1px;background:var(--gd)}
.tile.sel{outline:2px solid var(--gd);outline-offset:1px}
.tile:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#444)}
.leg{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 2px;font-size:11px;color:var(--mu)}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.person{display:flex;gap:12px;align-items:flex-start}
.mono-av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:15px;background:#1f2228;border:1px solid var(--ln);color:var(--gd)}
.tag{display:inline-block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--ln);color:var(--mu);margin-right:4px}
.tag.r{color:#e08a82;border-color:#4a2522}.tag.g{color:var(--gd);border-color:var(--gd2)}
.meter{height:10px;border-radius:5px;background:#22252b;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%}
/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(4,5,6,.82);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:0}
#modal .box{width:100%;max-width:680px;max-height:92vh;overflow:auto;background:linear-gradient(#15171b,#101215);border:1px solid var(--ln);border-bottom:0;border-radius:14px 14px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}
@media(min-width:700px){#modal{align-items:center}#modal .box{border-radius:12px;border-bottom:1px solid var(--ln)}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.ekick{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gd)}
.etitle{font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.15;margin:4px 0 12px}
.etext{font-size:15px;line-height:1.65;color:#d9d3c6}
.etext p+p{margin-top:10px}
.choices{margin-top:18px;display:grid;gap:8px}
.choice{text-align:left;padding:12px 14px;border:1px solid var(--ln);border-radius:8px;background:#1a1d22;display:block;width:100%}
.choice:hover{border-color:var(--gd2)}
.choice b{font-weight:600;font-size:14px;display:block}
.choice span{font-size:12px;color:var(--mu);display:block;margin-top:3px}
.choice .od{float:right;font-family:var(--mono);font-size:12px;color:var(--gd);margin-left:8px}
.choice[disabled]{opacity:.35;cursor:not-allowed}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.fx span{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:4px;border:1px solid var(--ln)}
.fx .up{color:var(--gn);border-color:#2f4229}.fx .dn{color:#e08a82;border-color:#4a2522}
/* title & setup */
.title{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px 48px;position:relative;overflow:hidden}
.sky{display:block;width:calc(100% + 44px);margin:0 -22px 28px;height:230px;opacity:.9}
.logo{font-family:var(--serif);font-weight:900;font-size:84px;letter-spacing:6px;line-height:.9;color:var(--tx)}
.logo em{font-style:italic;font-weight:500;color:var(--gd);font-size:18px;letter-spacing:3px;display:block;margin-top:10px}
.tagline{color:var(--mu);max-width:420px;margin:16px 0 26px;font-size:14px}
.opt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt button{text-align:left;padding:11px;border:1px solid var(--ln);border-radius:7px;background:var(--p)}
.opt button b{display:block;font-size:13.5px}
.opt button span{display:block;font-size:11.5px;color:var(--mu);margin-top:3px;line-height:1.35}
.opt button.on{border-color:var(--gd);background:#1b1913;box-shadow:inset 0 0 0 1px var(--gd2)}
input[type=text]{width:100%;background:var(--p);border:1px solid var(--ln);border-radius:6px;padding:10px 12px;color:var(--tx);font:inherit;font-size:15px}
input[type=text]:focus{outline:none;border-color:var(--gd2)}
.note{font-size:12.5px;color:#d7b57a;background:#1b1913;border:1px solid var(--gd2);border-radius:6px;padding:9px 11px;margin-top:8px}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:30;background:#2a1715;border:1px solid #5a2723;color:#f0c2bc;padding:9px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
.end{min-height:100vh;padding:60px 22px 40px}
.end h1{font-family:var(--serif);font-size:44px;line-height:1.05;margin:8px 0 16px}
.end .epi{font-family:var(--serif);font-style:italic;font-size:18px;color:#d9d3c6;line-height:1.6;max-width:560px}
</style>
</head>

</div>
<div id="dock" class="hidden"><div class="in"><button id="endy" data-a="endWeek">End Week</button><nav id="tabs"></nav></div></div>
<div id="modal" class="hidden"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script>
'use strict';

const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function money(n){const s=n<0?'−':'';n=Math.abs(Math.round(n));if(n>=1e6)return s+'$'+(n/1e6).toFixed(n>=1e7?1:2)+'M';if(n>=1e3)return s+'$'+Math.round(n/1e3)+'K';return s+'$'+n;}
function odds(...a){const diff=a.pop();const avg=a.reduce((x,y)=>x+y,0)/a.length;return clamp(0.5+(avg-diff)/80,0.05,0.95);}
function toast(t,inf){const e=$('#toast');e.textContent=t;e.classList.toggle('info',!!inf);e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),2200);}

function ledger(g,roll){
 const v=()=>roll?(0.85+Math.random()*0.3):1;const eb=empireBonus(g);
 let rk=0,heat=0,laund=0,sec=0;
 for(const [ck,dist] of cityList(g)){const mine=dist.filter(d=>d.own==='you');const ce=ebN(mine.length),cm=cityMult(g,ck),hf=cm>1?1.4:1;for(const d of mine){sec+=(d.sec||0)*8000;for(const k of d.rk){if((d.dmg||[]).includes(k))continue;const r=RK[k];let inc=r.i*(0.7+0.3*d.w)*(1+g.s.business/200)*ce*cm;if(trad(g)&&r.trad)inc*=1.25;if(!trad(g)&&(r.drug||r.mod))inc*=1.2;rk+=inc*v();heat+=r.h*hf;laund+=r.l||0;}}}
 if(g.prison)rk*=0.5;
 let crew=0,fix=0,books=0;for(const c of active(g)){if(c.role==='earner')crew+=c.sk*7000*v();else crew+=c.sk*1200;if(c.role==='fixer')fix+=c.sk;if(c.role==='books')books+=c.sk;if(c.role==='shooter')heat+=1.5;}
 if(g.prison)crew*=0.6;
 laund+=books*15000;
 const street=fam(g)&&!g.prison?[12000,30000,55000,90000,0][g.rank]+(g.f.ceiling?20000:0):0;
 const famD=g.dist.filter(d=>d.own==='family').length;
 let cut=0;if(fam(g)&&g.rank===4)cut=famD*90000*v();else if(fam(g)&&g.rank===3)cut=famD*25000;
 let ven=0;for(const k of g.ventures){ven+=VEN[k].i*v();heat+=VEN[k].h;}
 let emp=0,empUp=0;for(const k of (g.emp||[])){const e=EMP[k];emp+=(e.i||0)*v();empUp+=e.u||0;laund+=e.l||0;heat+=e.h||0;}
 for(const k in (g.ops||{})){const o=OPS[k];laund+=o.l||0;empUp+=o.u||0;}
 const gross=rk+crew;let trib=0;
 if(fam(g)&&g.rank<4)trib=gross*[0.35,0.25,0.2,0.1][g.rank]*({honest:1,light:0.7,heavy:0.4}[g.tribute]);
 const pay=active(g).reduce((a,c)=>a+c.pay,0);
 const L=g.life;const up=(g.age<18?2000:12000)+L.car*6000+L.house*25000+(L.suits+L.jewel)*3000+(L.boat||0)*20000+(L.getaway||0)*25000+(L.art||0)*4000+g.kids.length*15000+(g.spouse&&g.spouse.married?20000:0)+(g.mistress?30000:0)+sec+empUp;
 const bribes=(g.npc.detective.pad?30000:0)+(g.npc.judge.owned?50000:0)+[0,15000,40000,120000][g.lawyer];
 const flash=(L.car+L.house+L.suits+L.jewel)*0.8+((L.boat||0)+(L.getaway||0)+(L.art||0))*0.5;
 const wars=liveR(g).filter(r=>r.war).length;heat+=wars*6;
 const net=rk+crew+street+cut+ven+emp-trib-pay-up-bribes;
 return{rk,crew,street,cut,ven,emp,trib,pay,up,bribes,net,heatGen:heat,flash,fix,laund,eb};}

 text:g=>`${BOSS(g)} doesn't raise his voice. He never does. "There's a rule in this thing, and you know it. Twenty years for a kilo, and every one of those kids sitting in a cell starts thinking about his own family instead of ours."\n\nHe knows about your drug business.`,
 ch:[
 {t:'Shut it down',f:g=>{for(const d of myD(g))d.rk=d.rk.filter(k=>k!=='drugs');A({favor:-6,loyalty:4});return`You close it down. The money stops. The old man's eyes soften by a degree.`;}},
 {t:'Deny it, keep it running',p:g=>odds(g.s.discretion,g.s.charisma,60),f:(g,w)=>{if(w){A({favor:-8});return`You swear on your mother. He lets it drop — for now.`;}A({favor:-25});g.f.marked=(g.f.marked||0)+1;return`He shows you a photo. You're in it. "Last time we talk about this."`;}},
 {t:'Offer him a piece of it',p:g=>odds(g.s.business,g.s.charisma,g.npc.boss?65:50),f:(g,w)=>{if(w){A({favor:8,cash:-40000});g.f.drugsOk=1;return`You put a number on the table. A long silence. "I never heard about any of this." That's a yes.`;}A({favor:-30});g.f.marked=(g.f.marked||0)+1;return`It's the wrong thing to say. You know it before you finish.`;}}
 ]},
{id:'pinched',force:5,cond:g=>g.y.pinched&&g.crew.find(c=>c.id===g.y.pinched&&c.st==='a'),title:'Pinched',
 text:g=>{const c=g.crew.find(c=>c.id===g.y.pinched);return`${crewName(c)} gets picked up on a gun charge and a parole violation. Looking at seven years. The feds are visiting him — you hear it from his lawyer, who is also your lawyer.\n\nHe has a wife and two kids in Bay Ridge.`},
 ch:[
 {t:'Take care of his family',s:'$30K and his loyalty holds',req:g=>cash(g)>=30000,why:'Needs $30K',f:g=>{const c=g.crew.find(c=>c.id===g.y.pinched);A({cash:-30000,respect:4,crewLoy:5});c.st='p';c.out=T(g)+R(104,260);c.loy=clamp(c.loy+25);return`Envelopes every month. His wife knows where they come from. So does he. He does his time like a man.`;}},
 {t:'Send a message to his cell',p:g=>odds(g.s.fear,g.s.violence,40),f:(g,w)=>{const c=g.crew.find(c=>c.id===g.y.pinched);c.st='p';c.out=T(g)+R(156,312);if(w){A({fear:6});return`A man he's never met sits down at his lunch table and talks about his kids' school. He understands.`;}c.rat=true;A({inv:12});return`He gets the message. He also gets scared enough to start talking.`;}},
 {t:'Do nothing',f:g=>{const c=g.crew.find(c=>c.id===g.y.pinched);c.st='p';c.out=T(g)+R(156,312);if(c.loy<55){c.rat=true;A({inv:10});}A({crewLoy:-5});return`You stay away. You tell yourself it's discretion. Your crew calls it something else.`;}}
 ]},
{id:'making',force:5,cd:3,cond:g=>fam(g)&&g.rank===0&&!g.f.contract&&!g.prison&&g.age>=20&&(trad(g)?g.her==='italian'&&g.s.respect>=30&&g.favor>=50:g.s.respect>=28&&g.favor>=45),title:'The Contract',
 text:g=>{const v=person(pick(['italian','irish','italian']));g.y.victim={name:full(v),why:pick(['has been sitting in a car with the FBI every Tuesday','skimmed two hundred thousand from the old man\'s book','put his hands on a capo\'s daughter','is talking to a rival family about switching sides','owes a debt he has decided not to pay'])};
  return`${S(g)} drives you to a diner off the expressway and tells you over pie. A ${pick(['bookmaker','loan shark','union delegate','car dealer'])} named ${g.y.victim.name} ${g.y.victim.why}.\n\n"${trad(g)?'The old man wants it done. You do this — you get your button.':'The organization wants it done. You do this — you\'re in, all the way.'} You got ${trad(g)?'six':'six'} weeks. You don't — we never had this conversation."`},
 ch:[
 {t:'Accept the contract',s:'A new action appears: carry it out within 6 weeks',f:g=>{g.f.contract={name:g.y.victim.name,due:T(g)+7,cased:0};A({favor:3});log(`Given a contract on ${g.y.victim.name}.`);return`You nod once. ${S(g)} leaves you with the check and a slip of paper: an address, a car, the time he walks his dog.`;}},
 {t:'Refuse',f:g=>{A({favor:-25,respect:-8,loyalty:-5});return`"I'll do anything else." ${S(g)} finishes his pie. "There isn't anything else." He leaves you with the check.`;}}
 ]},
{id:'makingM',force:0,once:1,cond:()=>false,title:'',text:'',ch:[{t:'',f:()=>null}]},
{id:'ceiling',force:5,once:1,cond:g=>fam(g)&&trad(g)&&g.her!=='italian'&&g.rank===0&&g.s.respect>=30,title:'The Glass Ceiling',
 text:g=>`${S(g)} says it kindly, which is worse. "You're the best earner I got. But you know how this thing works. You'll never get your button — not with that name. That's not me. That's a hundred years of rules."`,
 ch:[
 {t:'Stay a trusted associate',s:'Bigger street cut, more crew — but no rank',f:g=>{g.f.ceiling=1;A({favor:10,loyalty:6});log('Accepted life as a trusted associate.');return`"Then I'll be the richest guy at the table who can't sit at it." He laughs. You don't.`;}},
 {t:'Break away and build your own',f:g=>{breakAway(false);A({respect:6,fear:4});return`You shake his hand, thank him for everything, and start recruiting the next morning. If they won't let you in, you'll build a room of your own.`;}}
 ]},
{id:'capo',force:4,cond:g=>fam(g)&&g.rank===1&&g.s.respect>=50&&g.favor>=60&&g.age>=26&&!g.prison,title:'A Crew of Your Own',
 text:g=>`${BOSS(g)} receives you in the back of a bakery. ${full(g.npc.sponsor)} is stepping back. "You'll take his crew. You'll take ${g.dist.find(d=>d.own==='family')?.n||'his territory'}. And you'll kick up like you always have."`,
 ch:[
 {t:'Accept, humbly',f:g=>capoUp(g,'humble')},
 {t:'Accept, and ask for more',p:g=>odds(g.s.charisma,g.s.respect,55),f:(g,w)=>{if(w){A({respect:4});return capoUp(g,'two');}A({favor:-10});return capoUp(g,'humble')+`\n\nThe extra territory you asked for? "Don't push your luck." He means it.`;}}
 ]},
{id:'underboss',force:4,cd:3,cond:g=>fam(g)&&g.rank===2&&g.s.respect>=66&&g.favor>=72&&g.age>=32&&g.npc.boss&&!g.prison&&chance(.55/52),title:'The Second Chair',
 text:g=>`${full(g.npc.underboss)}, the underboss, is going away for fifteen years. ${BOSS(g)} wants you at his right hand. "You'll see everything. You'll answer for everything."`,
 ch:[
 {t:'Take the chair',f:g=>{g.rank=3;A({respect:10,favor:5,heat:6});log('Named Underboss of '+FAM(g)+'.');return`You kiss him on both cheeks. Every capo in the family now has a reason to love you, and a reason to want you dead.`;}},
 {t:'Decline — stay a capo for now',f:g=>{A({favor:4,loyalty:4,discretion:3});return`"I'm more use to you on the street." He appreciates the modesty. He also remembers it.`;}}
 ]},
{id:'bossGone',force:9,cond:g=>g.y.bossGone&&fam(g),title:'The Old Man Is Gone',
 text:g=>`${g.y.bossGone==='dead'?`${BOSS(g)} dies in his sleep at ${g.npc.boss.age}. The wake is three days. The FBI photographs every car.`:`${BOSS(g)} is indicted and denied bail at ${g.npc.boss.age}. He won't come home.`}\n\n${g.rank===3?'As underboss, the chair is yours — if you can hold it.':'The family needs a new boss. Two men want it.'}`,
 ch:[
 {t:'Consolidate quietly',hide:g=>g.rank!==3,f:g=>{bossUp(g);A({discretion:3,respect:6});return`You change nothing for six months. You meet every capo alone. When you finally move, everyone is already yours.`;}},
 {t:'Clean house',hide:g=>g.rank!==3,f:g=>{bossUp(g);A({fear:15,respect:6,heat:16,kills:2,violence:3});return`Two capos who were talking to the other side don't make it to spring. Nobody else needs to be told anything.`;}},
 {t:'Back the underboss',hide:g=>g.rank===3,f:g=>newBoss(g,.55,true)},
 {t:'Back the young capo',hide:g=>g.rank===3,f:g=>newBoss(g,.45,false)},
 {t:'Stay neutral',hide:g=>g.rank===3,f:g=>{const b=person('italian');g.npc.boss={...b,age:R(56,66),rel:20};g.favor=clamp(g.favor*0.7+10);return`You keep your head down. ${full(b)} takes the chair. He doesn't owe you anything, and you don't owe him.`;}}
 ]},
{id:'ratOut',force:4,cond:g=>active(g).some(c=>c.rat)&&chance((g.s.street+g.s.discretion)/260/35),title:'A Wire',
 text:g=>{const c=active(g).find(c=>c.rat);g.y.rat=c.id;return`A cop on somebody's payroll passes word: one of your people has been wearing a wire. It's ${crewName(c)}.\n\nHe's coming to the club tonight like nothing's wrong.`},
 ch:[
 {t:'He has to go',f:g=>{const c=g.crew.find(c=>c.id===g.y.rat);c.st='d';A({fear:10,respect:6,heat:10,kills:1,inv:-15});log(`${crewName(c)}, an informant, disappeared.`);return`He doesn't come back from a fishing trip. The case against you loses its best witness.`;}},
 {t:'Feed him false information',p:g=>odds(g.s.street,g.s.discretion,g.s.business,45),f:(g,w)=>{const c=g.crew.find(c=>c.id===g.y.rat);if(w){A({inv:-20,street:4});c.st='g';return`For six months he tells the FBI exactly what you want them to hear. They raid an empty warehouse. Then you cut him loose — and let his handlers find out how useless he was.`;}A({inv:10});c.st='g';return`He figures out you know. He's in witness protection by Friday.`;}},
 {t:'Cut him loose',f:g=>{const c=g.crew.find(c=>c.id===g.y.rat);c.st='g';A({inv:5,respect:-4});return`You tell him you know. He leaves town. He takes what he already gave them with him.`;}}
 ]},
{id:'proposal',force:3,cond:g=>g.dating&&T(g)-g.dating.since>=39&&!g.prison,title:'Sunday at Her Mother\'s',
 text:g=>`${g.dating.first}'s mother has made too much food again. Her father, who drives a bus and has never once asked what you do, pours you a glass of wine and says, "So."`,
 ch:[
 {t:'Propose',f:g=>{g.spouse={first:g.dating.first,rel:75,married:true,since:T(g)};g.dating=null;A({respect:4,loyalty:3,cash:-25000,health:3});log(`Married ${g.spouse.first}.`);return`A church wedding, three hundred guests, envelopes stacked like bricks. ${g.spouse.first} looks at you during the vows like you're a better man than you are. You decide to try.`;}},
 {t:'Not yet',f:g=>{g.dating.since=T(g);return`Her father nods slowly. ${g.dating.first} is quiet on the drive home.`;}},
 {t:'End it — this life is no place for her',f:g=>{g.dating=null;A({discretion:2,health:-2,hurt:0});return`You tell her it isn't her. That part is true.`;}}
 ]},
{id:'divorce',force:3,cond:g=>g.spouse&&g.spouse.married&&g.spouse.rel<8,title:'The Lawyer Calls',
 text:g=>`${g.spouse.first} has a lawyer now. Not one of yours. She wants the house, the kids most weekends, and an accounting of money she knows you can't explain.`,
 ch:[
 {t:'Pay whatever she wants, quietly',req:g=>cash(g)>=200000,why:'Needs $200K',f:g=>{A({cash:-200000,kids:-10});g.spouse=null;log('Divorced.');return`You sign everything. She doesn't testify about anything. It's the most expensive silence you've ever bought, and the cheapest.`;}},
 {t:'Fight it',f:g=>{A({inv:15,kids:-20,respect:-4});g.spouse=null;log('Divorced, bitterly.');return`Her lawyer subpoenas your tax returns. An FBI agent reads the transcript with great interest.`;}},
 {t:'Beg her for one more chance',p:g=>odds(g.s.charisma,45),f:(g,w)=>{if(w){g.spouse.rel=40;if(g.mistress){g.mistress=null;}return`You end everything you need to end. She takes the papers back. She doesn't take her eyes off you for a year.`;}A({cash:-Math.min(cash(g),150000),kids:-15});g.spouse=null;log('Divorced.');return`She's already gone. The lawyer sends the papers anyway.`;}}
 ]},
{id:'mistressThreat',force:3,cond:g=>g.mistress&&g.mistress.rel<22,title:'She Knows Things',
 text:g=>`${g.mistress.first} is done being a secret. She knows where the club's second set of books is kept, and she knows the name of a man who went missing last spring. She wants an apartment in her name and a number with a lot of zeros.`,
 ch:[
 {t:'Pay her',req:g=>cash(g)>=120000,why:'Needs $120K',f:g=>{A({cash:-120000});g.mistress=null;return`She gets the apartment. You get her signature on nothing at all, and an understanding.`;}},
 {t:'Scare her off',p:g=>odds(g.s.fear,50),f:(g,w)=>{g.mistress=null;if(w){A({fear:4});return`She moves to Arizona. She never calls again.`;}A({inv:18,spouse:-30});return`She goes to your wife first, and then to the FBI.`;}},
 {t:'Win her back',p:g=>odds(g.s.charisma,50),f:(g,w)=>{if(w){g.mistress.rel=55;A({cash:-30000});return`Diamonds and a weekend in Atlantic City. She softens. For now.`;}A({spouse:-25});g.mistress=null;return`She tells your wife everything anyway.`;}}
 ]},
{id:'motherDies',force:3,once:1,cond:g=>g.npc.mother.alive&&g.npc.mother.age>=72&&chance(.25/52),any:1,title:'Ma',
 text:g=>`Your mother dies on a Tuesday, in the house you grew up in, with the radio on.${g.prison?' The Bureau of Prisons denies your request to attend the funeral.':''}\n\nShe never once asked what you did for a living. She lit a candle for you every Sunday.`,
 ch:[{t:'Bury her like a queen',f:g=>{g.npc.mother.alive=false;A({cash:-Math.min(cash(g),30000),respect:4,loyalty:3});log('Buried Ma.');return`Every capo in the city sends flowers. The old women from the parish pretend not to know who they're from.`;}},
  {t:'Keep it small',f:g=>{g.npc.mother.alive=false;A({discretion:3});log('Buried Ma.');return`Family only. You stand at the grave longer than anyone.`;}}]},
{id:'kidPath',force:2,cond:g=>g.kids.some(k=>k.age>=16&&!k.path),title:g=>'Your Kid',
 text:g=>{const k=g.kids.find(k=>k.age>=16&&!k.path);g.y.kid=k.first;return`${k.first} is sixteen. ${k.sex==='m'?'He':'She'} knows. Of course ${k.sex==='m'?'he':'she'} knows — every kid in the neighborhood knows. Tonight ${k.sex==='m'?'he':'she'} asks you straight: "I want in. I want to work for you."`},
 ch:[
 {t:'Bring them into the life',f:g=>{const k=g.kids.find(k=>k.first===g.y.kid&&!k.path);k.path='life';A({loyalty:4,respect:2,spouse:-25});k.rel=clamp(k.rel+15);g.crew.push({...mkCrew(),first:k.first,last:g.last,nick:'Junior',role:'earner',sk:4,loy:90,gr:15,pay:20000,her:g.her});log(`${k.first} joined your crew.`);return`You give ${k.first} a job at the club and a lecture about phones. Your spouse won't speak to you for a month.`;}},
 {t:'Send them to college, far away',req:g=>cash(g)>=120000,why:'Needs $120K',f:g=>{const k=g.kids.find(k=>k.first===g.y.kid&&!k.path);k.path='college';A({cash:-120000,spouse:15});k.rel=clamp(k.rel-5);log(`${k.first} left for college.`);return`Four years, out of state. ${k.first} is angry at the airport. Twenty years from now, ${k.first} will understand.`;}},
 {t:'Forbid it',f:g=>{const k=g.kids.find(k=>k.first===g.y.kid&&!k.path);k.path='straight';k.rel=clamp(k.rel-20);return`"Not you. Never you." ${k.first} slams the door. But stays out of it.`;}}
 ]},
{id:'health',force:3,cd:5,any:1,cond:g=>g.age>=45&&g.s.health<55&&chance(.45/52),title:'Chest Pains',
 text:g=>`It starts at a christening — a fist closing inside your chest. The doctor at Mount Sinai, who you've known since high school, doesn't joke. "Lose thirty pounds, stop the cigars, cut the stress. Or I'll see you at your own wake."`,
 ch:[
 {t:'Take it seriously',f:g=>{A({health:15,respect:-2});g.f.slow=g.year;return`Salads. Walks. You hand off some meetings. The younger guys notice you're less around.`;}},
 {t:'Ignore him',f:g=>{A({health:-6,hurt:0});return`You light a cigar in the parking lot.`;}}
 ]},
{id:'warDecl',force:7,cd:0.1,cond:g=>g.y.warDecl&&rival(g,g.y.warDecl)&&!rival(g,g.y.warDecl).war,title:'They Want a War',
 text:g=>{const r=rival(g,g.y.warDecl);return`${r.boss} has been telling anyone who'll listen that you've gotten too big. Tonight two of your shopkeepers in ${(myD(g)[0]||{n:'the neighborhood'}).n} got visits, and a wreath was left on the hood of your car.\n\n${r.n} is going to war with you unless something changes — now.`},
 ch:[
 {t:'Then it\'s war',f:g=>{const r=rival(g,g.y.warDecl);r.war=true;r.host=100;A({respect:3,fear:2});log(`War with ${r.n}.`);return`You send the wreath back with a bullet in it. From tonight, ${r.n} will hit your businesses every week. Fortify. Repair. Hit back harder.`;}},
 {t:'Pay tribute to keep the peace',s:'Costs money and face',req:g=>cash(g)>=60000+myD(g).length*25000,why:'Not enough cash',f:g=>{const r=rival(g,g.y.warDecl);const c=60000+myD(g).length*25000;A({cash:-c,respect:-5});r.host=clamp(r.host-30);return`${money(c)} in a gym bag. ${r.boss} counts it in front of you. Peace — and everyone knows what it cost.`;}},
 {t:'Arrange a sit-down',p:g=>odds(g.s.charisma,g.s.respect,52),f:(g,w)=>{const r=rival(g,g.y.warDecl);if(w){r.host=clamp(r.host-22);A({respect:2,charisma:.5});return`Over veal at a neutral place, you give a little, take a little, and walk out without a war.`;}r.war=true;r.host=100;log(`War with ${r.n}.`);return`${r.boss} doesn't show. His answer comes at 3 a.m., through the front window of your club. It's war.`;}}
 ]},
{id:'peaceOffer',force:6,cd:0.2,cond:g=>g.y.peace&&rival(g,g.y.peace)&&rival(g,g.y.peace).war,title:'They\'re Asking for Peace',
 text:g=>{const r=rival(g,g.y.peace);return`${r.n} is bleeding. ${r.boss} sends an old man from a neutral family with an offer: they'll pay tribute and hand over territory if you stop.\n\nOr you could finish them.`},
 ch:[
 {t:'Accept — take their money and a district',f:g=>{const r=rival(g,g.y.peace);r.war=false;r.host=40;const tr=100000+R(0,150000);A({dirty:tr,respect:6});let x='';const rd=g.dist.filter(d=>d.own===r.id);if(rd.length){const d=pick(rd);takeDistrict(g,d);x=` They hand over ${d.n}.`;}log(`${r.n} sued for peace.`);return`${money(tr)} in tribute.${x} The war is over, and everyone in the city knows who won it.`;}},
 {t:'Refuse. Finish them.',f:g=>{A({fear:5,respect:2});return`You send the old man home with nothing. Every week, a little more of ${rival(g,g.y.peace).n} disappears.`;}}
 ]},
{id:'newFam',force:5,cd:0.1,cond:g=>g.y.newFam&&rival(g,g.y.newFam),title:'New Blood',
 text:g=>{const r=rival(g,g.y.newFam);return`Nature hates a vacuum, and so does this city. ${r.n.replace(/^the /,'The ')} — ${r.t.toLowerCase()}, led by ${r.boss} — have moved in${g.dist.some(d=>d.own===r.id)?` and planted flags in ${g.dist.filter(d=>d.own===r.id).map(d=>d.n).join(' and ')}`:` — and there's no open turf left. Everything here is yours, which means everything they want is yours${r.war?'. They\'ve already declared war':''}`}. They're hungry${g.dist.some(d=>d.own===r.id)?', and they don\'t know you yet':''}.`},
 ch:[
 {t:'Welcome them with a sit-down',f:g=>{const r=rival(g,g.y.newFam);r.host=clamp(r.host-15);A({charisma:.5});return`A long dinner. You explain how things work here. ${r.boss} listens — for now.`;}},
 {t:'Send a message on day one',f:g=>{const r=rival(g,g.y.newFam);r.host=clamp(r.host+20);r.str=Math.max(5,r.str-6);A({fear:4,heat:4});return`Their first collector in the city ends up in the hospital. They know your name now.`;}},
 {t:'Let them be',f:g=>'You watch, and wait, and learn what they want.'}
 ]},
{id:'scouted',force:3,once:1,cond:g=>!fam(g)&&!g.famName&&g.f.young&&g.age>=17&&g.s.respect>=14&&!g.prison&&chance(1/26),title:'A Capo Takes Notice',
 text:g=>`${S(g)}, a capo in ${CITIES[homeOf(g)].fam}, has been watching you work the avenue. He buys you an espresso and gets to the point. "You got something. You want to keep running around with kids, or you want to learn how this thing really works?"${trad(g)&&g.her!=='italian'?`\n\nHe doesn't say it, but you both know: a traditional family will never make you.`:''}`,
 ch:[
 {t:'Join the family as an associate',f:g=>{joinFamily(g);A({respect:3});return`You're with ${CITIES[homeOf(g)].fam} now. Your associates come with you. The ladder starts at the bottom rung.`;}},
 {t:'Thank him — you\'ll build your own',f:g=>{A({respect:2,fear:1});const fr=rival(g,'fam');if(fr)fr.host=clamp(fr.host+10);return`He smiles like he's heard it before. "Then don't build it on our corners."`;}}
 ]},
{id:'foundReady',force:2,once:1,cond:g=>canFound(g),title:'Something With a Name',
 text:g=>`Your guys have started calling it "the outfit" when they think you're not listening. You've got the money, the respect, and men who'd follow you anywhere. Maybe it's time to stop being a crew.`,
 ch:[{t:'Name your family',f:g=>{setTimeout(foundModal,0);return'NOOP';}},{t:'Not yet',f:g=>'You can found your family any time from Big moves.'}]},
/* ---------- RANDOM: EARLY / STREET ---------- */
{id:'envelope',once:1,cond:g=>g.age<=24&&fam(g)&&!g.prison,title:'The Envelope',
 text:g=>`${S(g)} slides a slip of paper across the espresso bar. A name — Hal Brenner, owns the deli on the corner — and a number. Six thousand. "Three weeks behind. Go see him. Today."`,
 ch:[
 {t:'Lean on him. Hard.',f:g=>{A({fear:6,violence:3,heat:4,favor:6,dirty:1500});return`You put his face into the deli case in front of his son. He pays that night, plus a little extra for your trouble. On the walk home your hands won't stop shaking. Then they do.`;}},
 {t:'Give him a week, quietly',p:g=>odds(g.s.charisma,g.s.street,32),f:(g,w)=>{if(w){A({respect:4,charisma:2,favor:2});return`He pays in five days, and tells people you're a reasonable man. Reasonable men collect for a long time.`;}A({favor:-6,respect:-3});return`A week becomes two. ${S(g)} has to send somebody else. Nobody says anything to you. That's worse.`;}},
 {t:'Cover the gap from your own pocket',req:g=>cash(g)>=6000,why:'Needs $6K',f:g=>{A({cash:-6000,favor:8,loyalty:4});return`You hand over six grand and say Hal paid. ${S(g)} counts it twice, then looks at you a long time. "You'll go far. Or you'll go broke."`;}}
 ]},
{id:'cards',cd:5,cond:g=>!g.prison,title:'The Friday Game',
 text:g=>`Somebody is cheating at the Friday card game in the back of the social club — a dentist from the suburbs with a marked deck and a rented Corvette. He's taken $40,000 off people who matter.`,
 ch:[
 {t:'Break his hands',f:g=>{A({fear:8,violence:2,heat:5,respect:3,dirty:20000});return`Both hands, in the alley, with a car door. He pays back half from a hospital bed and never plays cards again.`;}},
 {t:'Make him pay it back double',p:g=>odds(g.s.fear,g.s.charisma,35),f:(g,w)=>{if(w){A({dirty:50000,respect:5,business:2});return`You explain the math to him slowly. He mortgages the Corvette. Everyone gets made whole, and you keep the difference.`;}A({respect:-3});return`He skips town the next morning. Somebody has to explain that to the guys he took.`;}},
 {t:'Let him keep playing — and keep losing',p:g=>odds(g.s.street,g.s.business,40),f:(g,w)=>{if(w){A({dirty:60000,street:3});return`You swap his deck for one of yours. For three months he loses everything — his savings, the Corvette, his practice. He thinks it's luck.`;}A({respect:-4});return`He spots the switch. He walks out with his winnings, and the guys he took blame you.`;}}
 ]},
{id:'truck',cd:4,cond:g=>!g.prison&&rankNum(g)<=2,title:'A Truck at the Airport',
 text:g=>`A cargo handler who owes you money has a tip: a trailer of designer handbags and electronics, sitting in a lot at the airport, with a driver who'll take a beating for $5,000 and say he never saw your face.`,
 ch:[
 {t:'Take it',p:g=>odds(g.s.street,g.s.violence,30)+(active(g).some(c=>c.role==='driver')?.1:0),f:(g,w)=>{if(w){A({dirty:R(70,120)*1000,respect:4,heat:6});return`The fence pays seventy cents on the dollar. Your crew eats steak for a month.`;}A({heat:14,inv:8,dirty:15000});return`A Port Authority cop sees the plates. You get away with a fraction of it and a lot of attention.`;}},
 {t:'Sell the tip to someone else',f:g=>{A({dirty:15000,discretion:2});return`Somebody else's crew takes the risk. You take a finder's fee.`;}},
 {t:'Pass',f:g=>{A({discretion:1});return`Something about the handler's eyes. You pass. Two weeks later, the guys who did it are arrested on camera.`;}}
 ]},
{id:'copPad',cd:5,cond:g=>!g.npc.detective.pad&&!g.prison&&g.s.heat>15,title:'A Cop Who Wants In',
 text:g=>`Detective ${full(g.npc.detective)} sits down at your table at the steakhouse without being asked. Twenty years on the job, two ex-wives, a boat payment. "I hear things before they happen. You should be hearing them too."`,
 ch:[
 {t:'Put him on the pad',s:'$30K a year; heat falls faster',f:g=>{g.npc.detective.pad=true;g.npc.detective.rel=55;A({heat:-8});return`An envelope every month. In exchange, you hear about raids a day early and his squad forgets your license plates.`;}},
 {t:'Get up and leave',f:g=>{A({discretion:2});g.npc.detective.rel-=10;return`Could be a setup. Could be a lonely cop. You don't wait to find out.`;}}
 ]},
{id:'bossWedding',once:1,cond:g=>fam(g)&&g.rank<4&&g.npc.boss&&!g.prison,title:'The Boss\'s Daughter Gets Married',
 text:g=>`Six hundred guests at a banquet hall. Every made man in the city lines up to hand ${BOSS(g)} an envelope. What's in yours will be counted, and remembered.`,
 ch:[
 {t:'$5,000 — respectable',req:g=>cash(g)>=5000,f:g=>{A({cash:-5000,favor:2});return`Respectable. Forgettable.`;}},
 {t:'$25,000 — generous',req:g=>cash(g)>=25000,why:'Needs $25K',f:g=>{A({cash:-25000,favor:9,respect:3});return`The old man's wife squeezes your hand at the end of the night.`;}},
 {t:'$75,000 — a statement',req:g=>cash(g)>=75000,why:'Needs $75K',f:g=>{A({cash:-75000,favor:16,respect:6,heat:2});return`People talk about your envelope for a year. Some with admiration. Some with arithmetic.`;}}
 ]},
{id:'funeral',cd:5,cond:g=>!g.prison,title:'A Wake on a Wednesday',
 text:g=>`An old-timer named ${full(person('italian'))} is dead at 81. He did twenty-two years and never said a word. Every man in the life will pay respects. So will the FBI, from a van across the street, with a long lens.`,
 ch:[
 {t:'Pay your respects',f:g=>{A({respect:5,loyalty:4,heat:4,favor:3});return`You kiss the widow. You shake forty hands. Somewhere in a federal office, your photo goes up on a corkboard.`;}},
 {t:'Send flowers and stay away',f:g=>{A({discretion:3,respect:-2});return`Smart. A few old men notice your absence, and say so.`;}}
 ]},
{id:'kid',once:1,cond:g=>!g.prison&&g.age<=30,title:'A Kid Who Wants In',
 text:g=>`A skinny fifteen-year-old has been hanging around outside the club for weeks, offering to wash cars, run coffee, anything. He reminds you of somebody.`,
 ch:[
 {t:'Give him errands',f:g=>{A({respect:2,loyalty:2});g.f.kidLater=g.year+5;return`He runs your errands for years. When he's twenty, he's the most loyal kid you've got.`;}},
 {t:'Send him back to school',f:g=>{A({respect:4,charisma:1});return`"You come around here again, I'll tell your mother." He goes. Years later he's a nurse, and he never forgets who sent him home.`;}}
 ]},
{id:'motherSick',once:1,cond:g=>g.npc.mother.alive&&g.age>=26&&!g.prison,title:'Ma\'s Sick',
 text:g=>`Your mother's insurance covers half of what the oncologist recommends. She tells you not to worry. She tells you that about everything.`,
 ch:[
 {t:'Pay for the best care',req:g=>cash(g)>=60000,why:'Needs $60K',f:g=>{A({cash:-60000,mother:15,loyalty:3});g.npc.mother.age-=4;return`The best doctors in the state. She recovers. She lights two candles for you now.`;}},
 {t:'Lean on the hospital administrator',p:g=>odds(g.s.fear,g.s.charisma,35),f:(g,w)=>{if(w){A({fear:3,mother:10});return`The paperwork goes away. So do the bills.`;}A({heat:6});return`He calls the police. She gets the care anyway, eventually.`;}},
 {t:'Do what you can',f:g=>{A({mother:-5});g.npc.mother.age+=3;return`She gets the standard treatment. She doesn't complain.`;}}
 ]},
{id:'meet',cd:3,cond:g=>!g.spouse&&!g.dating&&g.age>=22&&g.age<=44&&!g.prison,title:'Somebody at the Restaurant',
 text:g=>{g.y.girl=pick(FEM);return`She's a hostess at the place on Second Avenue, finishing a nursing degree at night. ${g.y.girl}. She doesn't care what car you drive, which is the first thing about her you can't stop thinking about.`},
 ch:[
 {t:'Ask her out',p:g=>odds(g.s.charisma,40),f:(g,w)=>{if(w){g.dating={first:g.y.girl,since:T(g)};A({health:3});return`Dinner turns into a walk turns into four hours. She makes you laugh at yourself, which nobody has done in years.`;}return`"I know who you are," she says, not unkindly. "No thank you."`;}},
 {t:'Keep your life simple',f:g=>{A({discretion:1});return`You leave a big tip and don't come back.`;}}
 ]},
{id:'hostess',cd:6,cond:g=>g.spouse&&g.spouse.married&&!g.mistress&&!g.prison&&g.age<60,title:'The Girl at the Club',
 text:g=>{g.y.girl=pick(FEM);return`${g.y.girl} manages the bar at your club. She laughs at your stories and stays late to do the receipts. Everybody in your position has a goomah. Everybody's wife knows, and pretends not to.`},
 ch:[
 {t:'Start an affair',f:g=>{g.mistress={first:g.y.girl,rel:65};A({respect:2,spouse:-8});return`An apartment on the other side of town. Thursday nights. You tell yourself it doesn't count.`;}},
 {t:'Go home to your family',f:g=>{A({spouse:6,loyalty:2});return`You transfer her to the other club. Your wife never knows how close it was.`;}}
 ]},
{id:'brotherInLaw',once:1,cond:g=>g.spouse&&g.spouse.married&&!g.prison,title:'Your Brother-in-Law',
 text:g=>`${g.spouse.first}'s brother Richie lost his job at the transit authority. Again. He wants work — "anything" — and ${g.spouse.first} wants you to give it to him.`,
 ch:[
 {t:'A no-show job on a construction site',f:g=>{A({spouse:12,heat:2,cash:-15000});return`Richie gets a hard hat and a paycheck and is never seen on site. He's grateful in a way that makes you nervous.`;}},
 {t:'Put him in your crew',f:g=>{A({spouse:15});const c=mkCrew();c.first='Richie';c.nick='';c.sk=2;c.loy=55;c.gr=60;c.role='driver';c.pay=12000;g.crew.push(c);return`Richie drives. Badly. But he's family.`;}},
 {t:'Say no',f:g=>{A({spouse:-15,discretion:2});return`Thanksgiving is very quiet this year.`;}}
 ]},
{id:'vandal',cd:3,cond:g=>myD(g).length&&liveR(g).some(r=>r.host>40)&&!g.prison,title:'A Message on Your Window',
 text:g=>{const r=liveR(g).filter(r=>r.host>40).sort((a,b)=>b.host-a.host)[0];g.y.vr=r.id;return`Somebody from ${r.n} roughs up two of your shopkeepers and spray-paints something rude on the window of your café. It's not a war. It's a question.`},
 ch:[
 {t:'Answer it — break some bones',f:g=>{const r=rival(g,g.y.vr);r.host=clamp(r.host+8);A({fear:6,respect:3,heat:5});return`Their collector spends a month in traction. Question answered.`;}},
 {t:'Arrange a sit-down',p:g=>odds(g.s.charisma,g.s.respect,45),f:(g,w)=>{const r=rival(g,g.y.vr);if(w){r.host=clamp(r.host-20);A({respect:3,charisma:1});return`Over veal at a neutral place, you draw lines on a napkin. Everyone leaves with something.`;}r.host=clamp(r.host+10);A({respect:-3});return`${r.boss} doesn't show. That's an answer too.`;}},
 {t:'Ignore it',f:g=>{const r=rival(g,g.y.vr);r.host=clamp(r.host+5);r.str+=3;A({respect:-4});return`You paint over it. They notice you painted over it.`;}}
 ]},
{id:'sitdown',cd:4,cond:g=>fam(g)&&g.rank>=1&&g.rank<4&&!g.prison,title:'A Sit-Down',
 text:g=>`Another capo, ${full(person('italian'))}, says a $4 million concrete contract in your area belongs to his crew because his cousin's company bid on it first. It goes before ${full(g.npc.consig)}, the consigliere.`,
 ch:[
 {t:'Argue your case',p:g=>odds(g.s.charisma,g.s.respect,g.s.business,50),f:(g,w)=>{if(w){A({dirty:120000,respect:6,business:2});return`You have the dates, the bids, and the better story. The consigliere rules for you. Your rival smiles at you all the way to the parking lot.`;}A({respect:-4,favor:-3});return`The consigliere rules against you. "Next time, come with paper."`;}},
 {t:'Concede gracefully',f:g=>{A({favor:8,loyalty:5});return`"It's his. I don't want a beef over cement." The old man hears about it, and likes it.`;}},
 {t:'Go around them — make a deal with the cousin directly',p:g=>odds(g.s.business,g.s.discretion,55),f:(g,w)=>{if(w){A({dirty:200000,business:3,favor:-2});return`The cousin needs a partner more than a relative. You split it under the table. Nobody can prove a thing.`;}A({favor:-22,respect:-6});g.f.marked=(g.f.marked||0)+1;return`The cousin tells his cousin. Going behind a sit-down is the kind of thing men disappear for.`;}}
 ]},
{id:'fedKnock',cd:5,cond:g=>g.inv>=45&&!g.prison,title:'A Card on the Table',
 text:g=>`Agent ${full(g.npc.fed)} and her partner stop you outside your kid's school — no warrant, just a conversation. "We know about ${pick(['the construction bids','the Tuesday collections','the club in the back','the money in the restaurant'])}. We know more than you think. When it comes apart, the first one who talks gets the deal."\n\nShe leaves a business card on the hood of your car.`,
 ch:[
 {t:'Say nothing and walk away',f:g=>{A({respect:3,discretion:2});return`You don't even look at the card. Your people hear you didn't look at the card.`;}},
 {t:'Call your lawyer',f:g=>{A({inv:-5,cash:-15000});return`Your lawyer files a harassment complaint and bills you for it. The pressure eases, a little.`;}},
 {t:'Keep the card',f:g=>{g.f.card=1;A({discretion:-3});return`You put it in your wallet behind a photo of your mother. You don't know why.`;}}
 ]},
{id:'politician',cd:5,cond:g=>!g.prison&&g.s.respect>=30,title:g=>'The '+CITIES[homeOf(g)].pol,
 text:g=>`${CITIES[homeOf(g)].pol} ${full(g.npc.alderman)} is in a tight reelection. He needs cash he can't report. In return: zoning variances, liquor licenses, a phone call when a city contract is coming.`,
 ch:[
 {t:'Fund him — $50K',req:g=>cash(g)>=50000,why:'Needs $50K',f:g=>{A({cash:-50000,pol:14});g.npc.alderman.rel=clamp(g.npc.alderman.rel+20);return`He wins by eleven hundred votes. He calls you personally to say thank you, from a phone that isn't his.`;}},
 {t:'Fund his opponent instead',req:g=>cash(g)>=40000,why:'Needs $40K',p:()=>.45,f:(g,w)=>{A({cash:-40000});if(w){A({pol:18});return`The underdog wins. He owes you everything, and he knows it.`;}A({pol:-6});g.npc.alderman.rel-=25;return`Your man loses. The ${CITIES[homeOf(g)].pol.toLowerCase()} finds out who backed him.`;}},
 {t:'Stay out of politics',f:g=>{A({discretion:2});return`Politicians are the only people in this city less trustworthy than you.`;}}
 ]},
{id:'union',cd:6,cond:g=>rankNum(g)>=1&&!g.prison,title:'The Local Election',
 text:g=>`Teamsters Local 4 is electing a new president. Whoever wins controls the pension fund, the hiring hall, and whether a single concrete truck rolls in this city. Your candidate is behind.`,
 ch:[
 {t:'Intimidate the other slate',p:g=>odds(g.s.fear,g.s.violence,45),f:(g,w)=>{if(w){A({pol:10,fear:5,dirty:80000,heat:8});g.f.union=1;return`The opposition candidate withdraws for "family reasons." Your man wins unopposed.`;}A({heat:15,inv:10});return`The Department of Labor puts the local under federal monitorship. Everyone looks at you.`;}},
 {t:'Buy the votes',req:g=>cash(g)>=80000,why:'Needs $80K',p:g=>odds(g.s.business,g.s.charisma,40),f:(g,w)=>{A({cash:-80000});if(w){A({pol:12,dirty:150000});g.f.union=1;return`Turkeys at Thanksgiving, envelopes at Christmas, a lot of new members' cousins. Your man wins. The pension fund starts making very interesting loans.`;}return`The money disappears and your man loses anyway.`;}},
 {t:'Sit this one out',f:g=>{return`Somebody else's man wins. You'll be paying them for labor peace.`;}}
 ]},
{id:'heist',cd:5,cond:g=>!g.prison&&g.s.street>=35,title:'The Big Score',
 text:g=>`An inside man at a cargo terminal: a vault holding untraceable foreign currency in transit, guarded by two rent-a-cops on the overnight shift. Eight figures, maybe. It's the kind of job men go to prison for the rest of their lives over.`,
 ch:[
 {t:'Plan it to the minute',p:g=>clamp(odds(g.s.street,g.s.discretion,g.s.business,50)+active(g).filter(c=>c.role==='driver').length*.06,.05,.85),f:(g,w)=>{if(w){const t=R(400,900)*1000;A({dirty:t,respect:12,heat:20,inv:15,street:4});log(`Pulled off the terminal heist: ${money(t)}.`);return`Eleven minutes. Nobody hurt. ${money(t)} in a laundry truck. It's on the news for a month. Everyone in the city knows it was you, and nobody can prove it.`;}A({heat:25,inv:30});const l=loseCrew(g,'in the terminal job');return`An alarm nobody told you about. ${l} You get out with nothing but a whole lot of FBI interest.`;}},
 {t:'Take a cut for blessing someone else\'s crew',f:g=>{A({dirty:100000,inv:4});return`You let a crew from out of town do it. You take a hundred thousand for your permission and your silence.`;}},
 {t:'Too hot. Pass.',f:g=>{A({discretion:3});return`Six months later, the guys who did it all go down. One of them is talking about everybody he's ever met.`;}}
 ]},
{id:'cartel',cd:6,cond:g=>!g.prison&&rankNum(g)>=1,title:'The Connect',
 text:g=>`A soft-spoken man from Sinaloa by way of Phoenix offers a pipeline: product on consignment, delivered to a warehouse of your choosing. "You don't have to touch it. Just distribute it."${trad(g)&&fam(g)&&!g.f.drugsOk?`\n\n${FAM(g)} has a rule about this. Officially.`:''}`,
 ch:[
 {t:'Take the pipeline',f:g=>{const d=myD(g).find(d=>d.rk.length<slots(d)&&!d.rk.includes('drugs'));if(d){d.rk.push('drugs');A({dirty:60000,heat:6});return`The first shipment arrives in a truckload of avocados. ${d.n} is now a drug market.`;}A({dirty:90000,heat:8,inv:6});return`No territory to run it through, so you take a one-time cut instead.`;}},
 {t:'Refuse',f:g=>{A({favor:fam(g)?4:0,discretion:2});return`"Not my business." He shrugs and finds someone else in a week.`;}},
 {t:'Take it to the boss first',hide:g=>!fam(g)||g.rank===4,f:g=>{A({favor:8,loyalty:4});return`${BOSS(g)} listens, then says no. But he appreciates that you asked.`;}}
 ]},
{id:'friend',once:1,cond:g=>g.age>=28&&!g.prison,title:'An Old Friend',
 text:g=>`${full(g.npc.friend)} — you grew up on the same stoop — teaches eighth-grade history now. His wife's small business is drowning, and a loan shark who isn't one of yours is on him for $40,000 at five points a week.`,
 ch:[
 {t:'Pay off the shark',req:g=>cash(g)>=40000,why:'Needs $40K',f:g=>{A({cash:-40000,friend:25,health:2,respect:2});return`You make one call and one payment. Your friend cries on the phone. He's never asked you for anything, before or since.`;}},
 {t:'Have a word with the shark',p:g=>odds(g.s.fear,g.s.respect,35),f:(g,w)=>{if(w){A({friend:20,fear:3});return`The debt simply stops existing.`;}A({friend:5,heat:4});return`The shark is connected to people you don't want a problem with. It takes a month and a favor to fix.`;}},
 {t:'Stay out of it',f:g=>{A({friend:-30});return`He doesn't ask again. At your mother's funeral years later, he nods at you from the back.`;}}
 ]},
{id:'witness',cd:5,cond:g=>active(g).length&&!g.prison&&g.s.heat>20,title:'A Witness',
 text:g=>`A bus driver saw two of your guys beat a man outside a bar on Eighteenth Street. He picked one out of a photo array. The DA thinks he has a case — and the case could lead to you.`,
 ch:[
 {t:'Pay him to forget',req:g=>cash(g)>=25000,why:'Needs $25K',p:()=>.75,f:(g,w)=>{A({cash:-25000});if(w){A({inv:-4});return`He recants. "It was dark. I was mistaken." The DA knows exactly what happened. So what.`;}A({inv:10});return`He takes the money and tells the DA about it.`;}},
 {t:'Send someone to explain things',p:g=>odds(g.s.fear,40),f:(g,w)=>{if(w){A({fear:4,heat:4});return`Two men sit across from him at a diner and say nothing at all. He moves to his sister's in Ohio.`;}A({heat:12,inv:12});return`He goes into protective custody, and now the DA has a witness-tampering charge too.`;}},
 {t:'Let the guy take his chances in court',f:g=>{const c=pick(active(g));c.st='p';c.out=T(g)+156;A({crewLoy:-6});return`${crewName(c)} goes down for three years. He keeps his mouth shut. Mostly.`;}}
 ]},
{id:'journalist',cd:6,cond:g=>g.s.respect>=50&&!g.prison,title:'A Reporter',
 text:g=>`An investigative reporter from the Tribune is writing a series on organized crime's grip on city contracts. Your name is in it. She's called four times for comment.`,
 ch:[
 {t:'Give her a charming "no comment"',p:g=>odds(g.s.charisma,50),f:(g,w)=>{if(w){A({respect:4});return`You invite her to lunch and talk about your mother's recipes for an hour. The profile makes you sound like a lovable rogue. The feds hate it.`;}A({heat:8});return`She quotes your "no comment" under a photo of your Bentley.`;}},
 {t:'Get your political friends to lean on her editor',req:g=>g.pol>=30,why:'Needs Political Pull 30',f:g=>{A({pol:-6,heat:-3});return`The series runs two parts instead of five. Your name is cut.`;}},
 {t:'Ignore her',f:g=>{A({heat:6});return`The series runs. Your neighbors read it. So does a federal prosecutor up for a promotion.`;}}
 ]},
{id:'press',cd:5,cond:g=>myD(g).some(d=>d.rk.includes('restaurant')||d.rk.includes('club'))&&!g.prison,title:'Good Press',
 text:g=>`The restaurant gets a glowing review — "the best veal in the city, served by waiters who look like they could handle a problem." Suddenly there's a two-month wait for a table, and the mayor's chief of staff wants a reservation.`,
 ch:[
 {t:'Comp the chief of staff',f:g=>{A({pol:8,clean:30000});return`He becomes a regular. Thursday nights, the corner table.`;}},
 {t:'Keep it legit and bank the money',f:g=>{A({clean:80000,business:3,heat:-3});return`For once, money you don't have to explain.`;}}
 ]},
{id:'xmas',force:1,cd:1,cond:g=>g.week>=49&&!g.prison&&g.s.respect>=25,title:'Christmas at the Club',
 text:g=>`Every year the club gives away turkeys and toys to the neighborhood. It costs a little. It buys a lot — the kind of goodwill that keeps old ladies from ever describing your face to a detective.`,
 ch:[
 {t:'Go big this year',req:g=>cash(g)>=20000,why:'Needs $20K',f:g=>{A({cash:-20000,respect:5,heat:-4,discretion:2});return`Four hundred turkeys and a Santa who did eight years for hijacking. The parish priest says a blessing over all of it.`;}},
 {t:'Keep it modest',f:g=>{A({respect:1,cash:-3000});return`Turkeys, a few toys, a handshake for everyone.`;}}
 ]},
{id:'crewLoan',cd:3,cond:g=>active(g).length&&!g.prison,title:'A Favor',
 text:g=>{const c=pick(active(g));g.y.c=c.id;return`${crewName(c)} asks for a loan — $25,000 — for his daughter's surgery. He's been loyal, mostly. He's also a gambler, mostly.`},
 ch:[
 {t:'Give it to him, no vig',req:g=>cash(g)>=25000,why:'Needs $25K',f:g=>{const c=g.crew.find(c=>c.id===g.y.c);A({cash:-25000,respect:2});c.loy=clamp(c.loy+25);return`He tries to kiss your hand. You don't let him. He'd take a bullet for you now.`;}},
 {t:'Give it to him at the usual rate',f:g=>{const c=g.crew.find(c=>c.id===g.y.c);c.loy=clamp(c.loy-15);A({dirty:8000});return`Business is business. He pays it back, and remembers you charged him.`;}},
 {t:'Say no',f:g=>{const c=g.crew.find(c=>c.id===g.y.c);c.loy=clamp(c.loy-20);return`He nods and says he understands. He doesn't.`;}}
 ]},
{id:'ambition',cd:4,cond:g=>active(g).some(c=>c.sk>=6&&c.loy<45)&&!g.prison,title:'An Ambitious Man',
 text:g=>{const c=active(g).find(c=>c.sk>=6&&c.loy<45);g.y.c=c.id;return`${crewName(c)} has been earning big and talking bigger. Word is he's been meeting people from ${pick(liveR(g)).n}, and telling anyone who'll listen that he should be running your crew.`},
 ch:[
 {t:'Make an example of him',f:g=>{const c=g.crew.find(c=>c.id===g.y.c);c.st='d';A({fear:12,respect:4,heat:10,kills:1,crewLoy:-4});log(`${crewName(c)} was killed for disloyalty.`);return`They find his car at the airport. Nobody in your crew talks about ambition for a long time.`;}},
 {t:'Give him more — buy his loyalty',req:g=>cash(g)>=40000,why:'Needs $40K',f:g=>{const c=g.crew.find(c=>c.id===g.y.c);A({cash:-40000});c.loy=clamp(c.loy+30);c.pay+=10000;return`A bigger cut and his own corner. It works — for now. Men like him always want the next thing.`;}},
 {t:'Cut him loose',f:g=>{const c=g.crew.find(c=>c.id===g.y.c);c.st='g';const r=pick(liveR(g));r.str+=5;return`He goes straight to ${r.n} and takes three of your customers with him.`;}}
 ]},
{id:'coupApproach',cd:8,cond:g=>fam(g)&&(g.rank===2||g.rank===3)&&g.npc.boss&&!g.prison,title:'A Walk in the Park',
 text:g=>{g.y.plotter=full(person('italian'));return`${g.y.plotter}, a capo with forty men and a grudge, walks with you in the cold. "The old man is going to get us all indicted. He talks in the car. He trusts the wrong people. A few of us are thinking about making a change. We need to know where you stand."`},
 ch:[
 {t:'You\'re in',p:g=>clamp(.25+(g.s.respect-50)/120+(crewStr(g)-30)/150+(g.rank===3?.15:0),.08,.8),f:(g,w)=>{if(w){bossUp(g);A({fear:15,respect:8,heat:22,kills:1,inv:10});log(`Took over ${FAM(g)} in a coup.`);return`Two weeks later, ${BOSS(g)} is shot outside a steakhouse on a Monday night.\n\nAt the meeting afterward, the capos look at you. ${g.y.plotter} nods. The chair is yours — and so is the knowledge that he helped put you there.`;}if(chance(.5)){end('whacked');return`Somebody talked. You learn which one the moment you sit down in the back seat.`;}breakAway(false);A({respect:-6});return`The plot is discovered. ${g.y.plotter} disappears. You get out of town for a month and come back as an enemy of the family.`;}},
 {t:'Tell the boss',f:g=>{A({favor:20,respect:4,loyalty:8});log(`Exposed a plot against ${BOSS(g)}.`);return`You tell the old man everything. ${g.y.plotter} is never seen again. The old man embraces you, and for the first time you smell how old he is.`;}},
 {t:'Stay out of it',f:g=>{A({discretion:3});return`"I didn't hear any of this." He smiles like you just told him everything he needed to know.`;}}
 ]},
{id:'irs',cd:6,cond:g=>g.clean>600000&&!g.prison,title:'A Letter from the IRS',
 text:g=>`The Internal Revenue Service would like to discuss the remarkable profitability of your businesses. Your accountant has sweat on his upper lip.`,
 ch:[
 {t:'Hire the best tax lawyers money can buy',req:g=>cash(g)>=120000,why:'Needs $120K',f:g=>{A({cash:-120000,inv:-3});return`Eighteen months of meetings. You pay a fine you can afford and sign nothing that matters.`;}},
 {t:'Pay the back taxes',f:g=>{const t=Math.round(g.clean*.25);A({clean:-t,heat:-6});return`${money(t)}. It hurts. It also makes you, on paper, an honest man.`;}},
 {t:'Stall',p:g=>odds(g.s.business,g.s.discretion,55),f:(g,w)=>{if(w)return`Your accountant buries them in paper. The case goes stale.`;A({inv:20});return`The IRS refers it to the Justice Department. They've been waiting for exactly this.`;}}
 ]},
{id:'expand',cd:5,cond:g=>isTop(g)&&!g.prison&&Object.keys(VEN).some(k=>!g.ventures.includes(k)),title:'Out of Town',
 text:g=>{const k=pick(Object.keys(VEN).filter(k=>!g.ventures.includes(k)));g.y.ven=k;return`An opportunity from another city: ${VEN[k].n}. The local players need a partner with money and muscle. The buy-in is ${money(VEN[k].c)}.`},
 ch:[
 {t:'Buy in',req:g=>cash(g)>=VEN[g.y.ven].c,why:'Not enough cash',f:g=>{A({cash:-VEN[g.y.ven].c,respect:6});g.ventures.push(g.y.ven);log(`Expanded: ${VEN[g.y.ven].n}.`);return`Your reach now extends past the city limits. So does federal jurisdiction.`;}},
 {t:'Not now',f:g=>'You stay focused at home.'}
 ]},
{id:'commission',cd:4,cond:g=>fam(g)&&g.rank===4&&!g.prison,title:'The Commission',
 text:g=>`The bosses of the region's families meet in a house in the suburbs. On the table: who controls the concrete on a billion-dollar stadium project. You can push, share, or play kingmaker.`,
 ch:[
 {t:'Push for the biggest piece',p:g=>odds(g.s.respect,g.s.fear,g.s.charisma,60),f:(g,w)=>{if(w){A({dirty:500000,respect:8});return`You get the lion's share. The other bosses smile and remember.`;}A({rivalHost:10,respect:-4});return`You overplay it. Two families vote together against you.`;}},
 {t:'Split it fairly',f:g=>{A({dirty:220000,respect:4,charisma:2,rivalHost:-8});return`Everyone eats. The stadium gets built over budget, which is the point.`;}}
 ]},
{id:'youngTurk',cd:5,cond:g=>isTop(g)&&!g.prison,title:'The Young Turk',
 text:g=>{g.y.yt=full(person(trad(g)?'italian':pick(Object.keys(HER))));return`${g.y.yt}, thirty-one, earns more than any of your capos and has a crew that worships him. He's respectful to your face. Behind your back, he tells people you're old.`},
 ch:[
 {t:'Promote him — keep him close',f:g=>{A({loyalty:4,respect:2});g.f.turk=(g.f.turk||0)+1;return`You give him a seat at the table. Now you can watch his hands.`;}},
 {t:'Have him killed',f:g=>{A({fear:14,heat:14,kills:1,crewLoy:-5});log(`Had ${g.y.yt} killed.`);return`He never sees his thirty-second birthday. The younger guys stop calling you old.`;}},
 {t:'Do nothing',f:g=>{g.f.marked=(g.f.marked||0)+(chance(.5)?1:0);return`Maybe he'll wait his turn. Men like that never do.`;}}
 ]},
{id:'retireOffer',once:1,cond:g=>fam(g)&&g.rank>=2&&g.rank<4&&g.age>=62&&!g.prison,title:'Step Aside',
 text:g=>`${BOSS(g)} suggests, kindly, that it's time you let a younger man take your crew. A comfortable retirement, a piece of the action for life, a house in Boca.`,
 ch:[
 {t:'Accept and retire',f:g=>{end(netWorth(g)>2e6?'retired':'quiet');return'You hand over your crew at a dinner with too many toasts.';}},
 {t:'Politely refuse',f:g=>{A({favor:-12});return`"I got a few more years in me." He smiles. He doesn't argue. That worries you.`;}}
 ]},
{id:'priest',once:1,cond:g=>g.age>=40&&!g.prison,title:'Father Dominic',
 text:g=>`The parish needs a new roof. Father Dominic, who baptized you, asks for a donation. Afterward, in the empty church, he asks if you'd like to make a confession. It's been twenty-two years.`,
 ch:[
 {t:'Pay for the roof, and confess',req:g=>cash(g)>=50000,why:'Needs $50K',f:g=>{A({cash:-50000,health:6,respect:3,heat:-2});return`You tell him some of it. Not all. He gives you a penance that would take ten lifetimes. You feel lighter on the walk to the car, which surprises you.`;}},
 {t:'Pay for the roof, skip the booth',req:g=>cash(g)>=50000,why:'Needs $50K',f:g=>{A({cash:-50000,respect:4});return`They put your name on a plaque in the vestibule. Your mother would have liked that.`;}},
 {t:'Not today, Father',f:g=>'He nods. He says he\'ll be here.'}
 ]},
{id:'grownKid',cd:6,cond:g=>g.kids.some(k=>k.age>=23)&&!g.prison,title:'A Wedding in the Family',
 text:g=>`${(g.kids.find(k=>k.sex==='f'&&k.age>=23)||g.kids.find(k=>k.age>=23)).first} is getting married. The guest list is a problem. Half the people you'd invite are under indictment, and the other half are federal agents' favorite photographs.`,
 ch:[
 {t:'Invite everyone — the old way',req:g=>cash(g)>=100000,why:'Needs $100K',f:g=>{A({cash:-100000,respect:8,favor:fam(g)?6:0,heat:6,kids:8});return`Six hundred guests, a fourteen-piece band, and a van across the street with tinted windows. It's the best night of your life.`;}},
 {t:'Keep the life out of it',f:g=>{A({kids:15,discretion:3,respect:-2});return`Family and friends only. Your kid hugs you at the end of the night and whispers, "Thank you."`;}}
 ]},
/* ---------- PRISON ---------- */
{id:'pYard',prison:1,cd:3,cond:()=>true,title:'The Yard',
 text:`A crew of younger inmates has decided you're old, rich, and soft. They want a cut of your commissary, and they want everyone to see them take it.`,
 ch:[
 {t:'Fight',p:g=>odds(g.s.violence,g.s.health,45),f:(g,w)=>{if(w){A({respect:8,fear:8});return`You put the biggest one in the infirmary with a lunch tray. Nobody asks for your commissary again.`;}wound(15);A({respect:-3});return`You spend three weeks in the infirmary. You'll be ready next time.`;}},
 {t:'Get the old-timers to step in',p:g=>odds(g.s.respect,50),f:(g,w)=>{if(w){A({respect:4});return`A lifer with connections to every family on the East Coast has a word. The kids apologize.`;}A({respect:-6});return`The old-timers don't know you well enough yet.`;}},
 {t:'Pay them',f:g=>{A({cash:-10000,respect:-6});return`It's only money. It's also a precedent.`;}}
 ]},
{id:'pOld',prison:1,once:1,cond:()=>true,title:'The Old Man in Cell Block C',
 text:`An old man with a cane and a library job turns out to be a legend — a former consigliere doing life. He's lonely, and he likes you.`,
 ch:[{t:'Listen and learn',f:g=>{A({street:6,business:4,discretion:5,respect:4});return`For two years he teaches you everything: how bosses fall, how money hides, how to tell a rat by the way he holds his coffee.`;}}]},
{id:'pGuard',prison:1,cd:4,cond:()=>true,title:'A Guard With Debts',
 text:`A guard with a gambling problem offers a cell phone and a blind eye — for $2,000 a month.`,
 ch:[{t:'Take the phone',f:g=>{A({cash:-24000,crewLoy:12,inv:6});return`You run your crew from a bunk. Loyalty holds. So does a federal wiretap, eventually.`;}},{t:'Don\'t risk it',f:g=>{A({discretion:3});return'Visiting hours will have to do.';}}]},
{id:'pParole',prison:1,cd:3,cond:g=>g.prison>=104,title:'Parole Hearing',
 text:`A board of three tired people with clipboards. They want remorse, a plan, and some sign that you've changed.`,
 ch:[{t:'Show remorse',p:g=>odds(g.s.charisma,g.s.discretion,55),f:(g,w)=>{if(w){g.prison=Math.max(1,g.prison-104);return`You talk about your kids. Some of it's even true. They cut two years off.`;}return'Denied. "Come back in two years."';}},
  {t:'Say nothing you don\'t have to',f:g=>{A({respect:4});return'Denied. But word gets back to the street that you didn\'t beg.';}}]},
{id:'pVisit',prison:1,cd:2,cond:g=>g.spouse&&g.spouse.married,title:'Visiting Day',
 text:g=>`${g.spouse.first} drives four hours with the kids. Through the glass, she looks tired in a way you've never seen.`,
 ch:[{t:'Promise her it\'ll be different',f:g=>{A({spouse:10,kids:8});return'She puts her hand on the glass. So do you.';}},{t:'Ask about the business',f:g=>{A({spouse:-10,crewLoy:6});return'She passes your messages along. She doesn\'t visit for a while after that.';}}]}
];
function capoUp(g,mode){g.rank=2;const fd=g.dist.filter(d=>d.own==='family');const n=mode==='two'?2:1;for(let i=0;i<n&&fd[i];i++){fd[i].own='you';}A({respect:8,favor:5});log(`Named ${trad(g)?'Capo':'Lieutenant'} in ${FAM(g)}.`);g.npc.sponsor.rel=clamp(g.npc.sponsor.rel+10);
 return`You get your own crew, your own territory, and your own set of problems. ${S(g)} retires to Florida and calls you every Sunday.`;}
function bossUp(g){g.rank=4;g.npc.boss=null;g.npc.underboss={...person('italian'),rel:60};log(`Became Boss of ${FAM(g)}.`);}
function newBoss(g,p,ub){const win=chance(p);const b=ub?g.npc.underboss:person('italian');g.npc.boss={...b,age:R(56,66),rel:win?60:5};if(ub)g.npc.underboss={...person('italian'),rel:20};
 if(win){A({favor:20,respect:4});log(`${full(b)} became boss, with your support.`);return`Your man wins. ${full(b)} remembers who stood with him early.`;}
 A({favor:-25});g.favor=Math.min(g.favor,25);log(`${full(b)} became boss. You backed the other side.`);return`Your man loses. ${full(b)} takes the chair, and remembers who stood against him.`;}

/* ================= ACTIONS (weekly) ================= */
const errandPay=g=>400+(g.f.errands||0)*30;
const fightPay=g=>300+(g.f.fwins||0)*150;
function fightNight(g){const wins=g.f.fwins||0;
 if(wins>=8&&T(g)-(g.f.lastTitle||-99)>=10&&chance(.06+Math.min(.06,wins*.003))){g.f.lastTitle=T(g);const purse=40000+wins*2000+(g.f.belts||0)*20000;const p=clamp(odds(g.s.violence,g.s.health,55+(g.f.belts||0)*5),.05,.9);
  openEvent({title:'A Title Fight',kick:dateStr(g),text:`${wins} wins and the right people have noticed. A promoter with a Rolex and a cigar offers you a shot at the belt — a ${pick(['former Golden Gloves champ','Russian ex-paratrooper','longshoreman nobody has ever knocked down','cage fighter from Jersey'])}, a packed warehouse, and serious money on the line.\n\nThe purse: ${money(purse)}.`,ch:[
   {t:'Take the fight',s:'Violence & health',p:()=>p,f:(g,w)=>{if(w){g.f.belts=(g.f.belts||0)+1;g.f.fwins=wins+1;A({dirty:purse,respect:5,fear:5,violence:1.5,health:-6,hurt:0});log(`Won an underground title fight — belt #${g.f.belts}.`);return`Seven rounds. Blood in your eyes, the crowd on its feet. In the seventh you catch him with a right hand they'll talk about for years. The belt is yours, and ${money(purse)} in a paper bag.`;}
    A({health:-15,respect:-1,violence:.5,hurt:0});g.f.fwins=Math.max(0,wins-3);return`He's everything they said. You go down in the fifth and wake up in the back of a car. Some of the shine is off your record.`;}},
   {t:'Not yet',f:g=>{g.ap++;return'You tell him you\'ll think about it. He says the offer won\'t last.';}}]});return'NOOP';}
 const w=chance(odds(g.s.violence,g.s.health,40));
 if(w){const a=fightPay(g)+R(0,400);g.f.fwins=wins+1;A({dirty:a,respect:.15,violence:.15,fear:.1,health:-1,hurt:0});return`${pick(['You put a longshoreman twice your size on the concrete in the third round.','A quick fight — two body shots and he folds.','It goes the distance. The crowd gives it to you.'])} ${money(a)}. Record: ${g.f.fwins} wins. Next purse: ${money(fightPay(g))}.`;}
 A({health:-4,respect:-.1,violence:.1,hurt:0});return`You lose on a cut over the eye. You learn something. It costs you some blood.`;}
const vioLvl=g=>Math.round((g.f.vio||0)+active(g).filter(c=>c.role==='shooter').length*2+(g.s.fear>70?5:0));
const vioF=g=>1+vioLvl(g)/40;
const ACT={
 hustle:{n:'Street Hustle',d:'Boost, fence, run numbers. Small money.',ok:g=>rankNum(g)<=2,run:g=>{const a=R(150,500)+Math.round(g.s.street*15);A({dirty:a,street:.12,heat:chance(.25)?.3:0,respect:g.age<20?.08:0});return pick([`Car stereos and a crate of cigarettes. ${money(a)}.`,`A numbers route nobody else wanted. ${money(a)}.`,`Sneakers that fell off a truck, sold out of a trunk. ${money(a)}.`,`You run bets for a bookie on Ninth Street. ${money(a)}.`]);}},

 contract:{n:'Carry Out the Contract',d:'',ok:g=>!!g.f.contract&&fam(g),menu:true},
 bar:{n:'Hit the Bar',d:'Work a shift, find love — or find trouble.',ok:g=>g.age>=18,menu:true},

 court:{n:'Hold Court at the Club',d:'$1.5K. Charisma, crew loyalty.',ok:g=>g.age>=18&&active(g).length>0,run:g=>{if(cash(g)<1500){G.ap++;toast('Needs $1.5K');return'NOOP';}A({cash:-1500,charisma:.15,crewLoy:.8,respect:.1});return`Espresso, anisette, and the same stories told better each time. Your guys leave laughing.`;}},
 track:{n:'Bet at the Track',d:'Risk money for a bigger payday.',ok:g=>g.age>=18,menu:true},
 recruit:{n:'Recruit',d:'Find men worth trusting.',ok:g=>true,menu:true},
 family:{n:'Time With Family',d:'Health, loved ones — and you cool off.',ok:g=>g.age>=18,run:g=>{A({health:.8,spouse:2.5,kids:2,mother:1.5,heat:-1.5});return g.spouse?`A Sunday with ${g.spouse.first}${g.kids.length?' and the kids':''}. You leave the phone in the car. Nobody's tailing a man at a kid's birthday party.`:`Sunday dinner at Ma's. She makes the gravy you like and asks when you're getting married.`;}},
 laylow:{n:'Lay Low',d:'Cool the heat. Stop being seen.',ok:g=>true,run:g=>{A({heat:-(2.5+(g.ops.safehouse?2:0))});return`No meetings in the car. No new faces. A quiet week.`;}},
 sweep:{n:'Sweep for Wires',d:'$15K. Hunt for rats and bugs.',ok:g=>active(g).length>0,run:g=>{if(cash(g)<15000){G.ap++;toast('Needs $15K');return'NOOP';}A({cash:-15000});const rat=active(g).find(c=>c.rat);const p=.35+g.s.street/250+active(g).filter(c=>c.role==='fixer').length*.08;if(rat&&chance(p)){Q.unshift(EV.find(e=>e.id==='ratOut'));return`Your guy finds a transmitter in a car door — and the car belongs to ${crewName(rat)}.`;}A({inv:-1});return rat?`Your sweeper finds nothing. You feel better. You shouldn't.`:`Clean. Nobody's wired. For now.`;}},
 pHead:{n:'Keep Your Head Down',d:'Health; let the heat die.',prison:1,run:g=>{A({health:.6,heat:-.5,discretion:.1});return'You read, you work in the laundry, you count days.';}},
 pRun:{n:'Run Things Through Visits',d:'Keep the crew loyal and earning.',prison:1,run:g=>{A({crewLoy:1.2,dirty:700*Math.max(1,myD(g).length),inv:.3});return'Coded messages through your lawyer. The street still knows who it belongs to.';}},
 pNet:{n:'Make Connections',d:'Respect inside, contacts outside.',prison:1,run:g=>{A({respect:.15,street:.15});return'Men from every family on the East Coast eat at your table.';}},
 pGym:{n:'Work Out',d:'Violence and health.',prison:1,run:g=>{A({violence:.25,health:.3});return'Push-ups in the cell, every morning, every night.';}},
 pLaw:{n:'Study Law',d:'Discretion and business.',prison:1,run:g=>{A({discretion:.5,business:.25});return'You read every RICO appeal in the prison library.';}}
};
